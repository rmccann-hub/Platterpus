name: Publish to PyPI

# Builds the wheel + sdist and publishes them to PyPI.
#
# HOW IT'S TRIGGERED: release.yml dispatches this workflow (`gh workflow run`)
# right after it creates the GitHub Release, on the release TAG — so the
# checkout below builds the released commit. It is deliberately NOT triggered by
# a `release: published` event: release.yml creates the release with the default
# GITHUB_TOKEN, and GitHub suppresses the events a GITHUB_TOKEN generates, so
# that trigger never fired (this is why v0.2.4–v0.2.7 shipped with no PyPI
# publish). workflow_dispatch is the documented exception — it always creates a
# run, even when dispatched via GITHUB_TOKEN — so it's the reliable hand-off.
# You can also run it by hand to retry a publish.
#
# This stays the OIDC ENTRY workflow (the token's workflow_ref is
# publish-pypi.yml), so the trusted-publisher config below is exactly what PyPI
# must match — keep it as-is.
#
# Authentication uses PyPI **Trusted Publishing** (OIDC) — there is no API
# token or secret stored in this repo. ONE-TIME SETUP on PyPI before the first
# release that should publish (https://docs.pypi.org/trusted-publishers/):
#
#   PyPI → Publishing → "Add a pending publisher" (or, once the project
#   exists, the project's Publishing tab) with:
#     PyPI Project Name:  platterpus
#     Owner:              rmccann-hub
#     Repository name:    Platterpus
#     Workflow name:      publish-pypi.yml
#     Environment name:   pypi
#
# Until that's configured the publish step fails LOUDLY (with `invalid-publisher`)
# — but in its OWN run, so a PyPI misconfiguration never blocks the AppImage
# release.

on:
  # Dispatched by release.yml after a release (see above); also runnable by hand
  # to retry a publish for an existing tag.
  workflow_dispatch:

permissions:
  contents: read

# ONE PUBLISH PER TAG AT A TIME, NONE CANCELLED (the 2026-10-27 review, item
# 2.7). A publish must never be cut off halfway, so `cancel-in-progress` is
# false. Grouping by the ref still queues a second dispatch for the same tag (a
# retry fired while the first is running) behind the first, and `skip-existing`
# then lets it pass over files the first uploaded. If a third arrives while the
# second waits, GitHub drops the waiting one, which never started.
concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # A named image, like every other job: `ubuntu-latest` moves to a new Ubuntu
    # on GitHub's schedule (to 26 from 2026-10-19), and this job runs once per
    # release, so it would meet the new image at a release. Held by
    # tests/test_workflow_permissions.py::test_every_job_names_its_runner_image.
    runs-on: ubuntu-22.04
    # Bounded like every other job — see tests/test_ci_jobs_are_bounded.py. Short,
    # because this job builds a wheel and uploads it; if it is still going at 30
    # minutes the upload is wedged, and a wedged publish is worth failing fast so
    # it can be re-dispatched for the same tag.
    timeout-minutes: 30
    # The environment name must match the PyPI trusted-publisher config above.
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing — required.
    steps:
      # The token stays out of .git/config (the 2026-10-27 review, item 1.4):
      # nothing in this job uses git with it, and the upload authenticates by
      # OIDC, not by the checkout's token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # NO `cache: pip` HERE, on purpose (the 2026-10-27 review, item 1.3): this
      # job holds `id-token: write` and uploads to PyPI, and a restored pip cache
      # is input another run wrote (zizmor: cache poisoning, high). Same reason as
      # release.yml's note.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # build and twine are PINNED, and the pins are READ OUT OF pyproject.toml
      # (its `publish` extra), the way ci.yml reads ruff's (Critical rule #11). They
      # ran unpinned here, in the one job that can publish to PyPI (the 2026-10-27
      # review, item 2.1). Reading them keeps one copy of each pin: a literal
      # version here could drift from pyproject's, and
      # tests/test_gating_tools_are_pinned.py refuses one.
      - name: Build wheel + sdist and validate metadata
        run: |
          python -m pip install --upgrade pip
          specs="$(python -c '
          import pathlib, tomllib
          extra = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"][
              "optional-dependencies"
          ]["publish"]
          print("\n".join(extra))
          ')"
          mapfile -t pins <<<"$specs"
          echo "pyproject pins:"
          printf '  %s\n' "${pins[@]}"
          python -m pip install "${pins[@]}"
          python -m build
          # Catch PyPI-invalid metadata before we try to upload.
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Idempotent re-runs: if this version is already on PyPI (e.g. a
          # release re-cut to re-upload AppImage assets), skip instead of
          # failing — PyPI versions are immutable.
          skip-existing: true
