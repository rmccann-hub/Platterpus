name: Publish to PyPI

# Builds the wheel + sdist and publishes them to PyPI.
#
# HOW IT'S TRIGGERED: release.yml dispatches this workflow (`gh workflow run`)
# right after it creates the GitHub Release, on the release TAG — so the
# checkout below builds the released commit. It is deliberately NOT triggered by
# a `release: published` event: release.yml creates the release with the default
# GITHUB_TOKEN, and GitHub suppresses the events a GITHUB_TOKEN generates, so
# that trigger never fired (this is why v0.2.4–v0.2.7 shipped with no PyPI
# publish). workflow_dispatch is the documented exception — it always creates a
# run, even when dispatched via GITHUB_TOKEN — so it's the reliable hand-off.
# You can also run it by hand to retry a publish.
#
# This stays the OIDC ENTRY workflow (the token's workflow_ref is
# publish-pypi.yml), so the trusted-publisher config below is exactly what PyPI
# must match — keep it as-is.
#
# Authentication uses PyPI **Trusted Publishing** (OIDC) — there is no API
# token or secret stored in this repo. ONE-TIME SETUP on PyPI before the first
# release that should publish (https://docs.pypi.org/trusted-publishers/):
#
#   PyPI → Publishing → "Add a pending publisher" (or, once the project
#   exists, the project's Publishing tab) with:
#     PyPI Project Name:  platterpus
#     Owner:              rmccann-hub
#     Repository name:    Platterpus
#     Workflow name:      publish-pypi.yml
#     Environment name:   pypi
#
# Until that's configured the publish step fails LOUDLY (with `invalid-publisher`)
# — but in its OWN run, so a PyPI misconfiguration never blocks the AppImage
# release.

on:
  # Dispatched by release.yml after a release (see above); also runnable by hand
  # to retry a publish for an existing tag.
  workflow_dispatch:

permissions:
  contents: read

# ONE PUBLISH PER TAG AT A TIME, NONE CANCELLED (the 2026-10-27 review, item
# 2.7). A publish must never be cut off halfway, so `cancel-in-progress` is
# false. Grouping by the ref still queues a second dispatch for the same tag (a
# retry fired while the first is running) behind the first, and `skip-existing`
# then lets it pass over files the first uploaded. If a third arrives while the
# second waits, GitHub drops the waiting one, which never started.
concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # A named image, like every other job: `ubuntu-latest` moves to a new Ubuntu
    # on GitHub's schedule (to 26 from 2026-10-19), and this job runs once per
    # release, so it would meet the new image at a release. Held by
    # tests/test_workflow_permissions.py::test_every_job_names_its_runner_image.
    runs-on: ubuntu-22.04
    # Bounded like every other job — see tests/test_ci_jobs_are_bounded.py. Short,
    # because this job builds a wheel and uploads it; if it is still going at 30
    # minutes the upload is wedged, and a wedged publish is worth failing fast so
    # it can be re-dispatched for the same tag.
    timeout-minutes: 30
    # The environment name must match the PyPI trusted-publisher config above.
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing — required.
    steps:
      # The token stays out of .git/config (the 2026-10-27 review, item 1.4):
      # nothing in this job uses git with it, and the upload authenticates by
      # OIDC, not by the checkout's token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # REF GATE (the follow-up review of 2026-10-27, item 2): this job holds
      # `id-token: write` and can be dispatched by hand on any ref, so without a
      # gate a branch's code could be published to PyPI. It publishes only a
      # `v*` tag whose commit is on `main`. The second half is release.yml's
      # branch gate, line for line (tests/test_release_git_steps.py holds the two
      # equal), and both halves refuse before anything is built or a token is
      # minted. The `pypi` environment's own branch rule is set in the
      # repository settings, which a session cannot read; this gate holds
      # whatever that rule says.
      #
      # A `v*` tag on an OLDER `main` commit passes, on purpose (asked in the
      # second follow-up review of 2026-10-27, item 6). The one legitimate
      # dispatch besides release.yml's is a retry of an existing release's
      # publish, and by then that release's commit is behind main's tip. The
      # gate's job is to keep code that never reached main off PyPI, which it
      # does. What it does not stop, a new `v*` tag pushed by hand on an old
      # main commit, publishes that commit's own `__version__`, and PyPI refuses
      # a second upload of a version it already has, so it can republish
      # nothing that was released.
      - name: Ref gate — publish only a v* tag whose commit is on main
        env:
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || ! printf '%s' "$REF_NAME" | grep -qE '^v[0-9]'; then
            echo "::error::This workflow publishes a release tag only, and it was dispatched on $REF_TYPE '$REF_NAME'. Dispatch it on the vX.Y.Z tag, as release.yml does."
            exit 1
          fi
          set -euo pipefail
          if ! git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"; then
            echo "::error::Could not fetch main, so there is no evidence $SHA is on it. Re-run once GitHub is reachable."
            exit 1
          fi
          rc=0
          git merge-base --is-ancestor "$SHA" refs/remotes/origin/main || rc=$?
          case "$rc" in
            0) echo "branch gate: $SHA is on main ($(git rev-parse --short refs/remotes/origin/main) is its tip). ✅" ;;
            1) echo "::error::$SHA is not on main. Releases and PyPI publishes come from main only: merge the pull request, wait for main's CI, then dispatch release.yml on main, which makes the tag and dispatches the publish on it."
               exit 1 ;;
            *) echo "::error::git merge-base could not compare $SHA with main (exit $rc), so there is no evidence it is on main."
               exit 1 ;;
          esac

      # NO `cache: pip` HERE, on purpose (the 2026-10-27 review, item 1.3): this
      # job holds `id-token: write` and uploads to PyPI, and a restored pip cache
      # is input another run wrote (zizmor: cache poisoning, high). Same reason as
      # release.yml's note.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # build and twine are installed at EXACT versions, VERIFIED BY HASH, in the
      # one job that can publish to PyPI. They ran unpinned here until the
      # 2026-10-27 review (item 2.1), then pinned to a minor range read from
      # pyproject's `publish` extra; a range still installs whatever patch release
      # PyPI serves that minute, a compromised one included (the review's
      # follow-up). build/locks/publish.lock is resolved from that extra and the
      # build backend by build/lock-requirements.sh, carries the sha256 of every
      # file for each version, and tests/test_dependency_locks.py holds it inside
      # pyproject's ranges, so the range still lives in one place.
      #
      # `--no-isolation`: build with the setuptools and wheel the lock just
      # installed. An isolated build fetches `setuptools>=77` and `wheel` from
      # PyPI by range, unhashed, which is the same hole one step later. No
      # `pip install --upgrade pip` either: that was an unhashed install too.
      - name: Build wheel + sdist and validate metadata
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r build/locks/publish.lock
          python -m build --no-isolation
          # Catch PyPI-invalid metadata before we try to upload.
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          # Idempotent re-runs: if this version is already on PyPI (e.g. a
          # release re-cut to re-upload AppImage assets), skip instead of
          # failing — PyPI versions are immutable.
          skip-existing: true
