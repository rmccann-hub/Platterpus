name: CI

# Run the test suite on every push to main and every pull request, so
# regressions are caught before they land. This is the same `pytest` that
# passes locally — the suite needs no CD hardware (whipper/MusicBrainz/Qt are
# all faked or run headless).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow a manual run on any branch. Needed because pushes/PRs made with a
  # GitHub App token (e.g. from a cloud session) do NOT auto-trigger `push`/
  # `pull_request` workflows — GitHub's recursion guard — so without this the
  # suite can't be run on such a branch at all. `workflow_dispatch` IS honoured
  # for App tokens (same path release.yml uses), so this is the escape hatch.
  workflow_dispatch:

# Least privilege: every job here only READS the repo (lint / test / changelog /
# media-guard). The default GITHUB_TOKEN is broad (contents: write, etc.), so pin
# it down — a compromised action pulled into CI then can't push, tag, or open
# PRs. The release/publish workflows declare their own (wider) permissions where
# they actually need them.
permissions:
  contents: read

jobs:
  # Lint + format check. Fast and dependency-light (ruff is a single binary,
  # no Qt libs needed), so it runs as its own job in parallel with the tests.
  lint:
    runs-on: ubuntu-22.04
    # A JOB-LEVEL bound, not just a step-level one. `Run tests` already carries
    # `timeout-minutes: 15` with the right reasoning written beside it — "fails in
    # minutes instead of burning the 6-hour default" — but it was applied to the step
    # the author was thinking about rather than to the surface the rule belongs on.
    # The step that has actually wedged is `Install headless Qt system libraries`: an
    # apt stall on the runner hung two jobs for 20+ minutes on 2026-08-18, twice, with
    # no bound at all and no way to tell a hang from slowness. That is this session's
    # recurring shape — a guard scoped to where a problem was expected — so the bound
    # now covers every step, including the ones nobody has seen fail yet.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # Read the pin OUT OF pyproject.toml rather than repeating it here.
      #
      # This step used to install `ruff>=0.15,<1` — the whole 0.x line — while
      # `[project.optional-dependencies].dev` pinned `>=0.15.22,<0.16`. So the
      # constraint CLAUDE.md Critical rule #11 exists to impose ("a tool that gates
      # CI must not float") was written down in the file that does NOT gate, and
      # absent from the one that does. A routine ruff 0.16 release would have turned
      # this job red with zero change to our code, and it would have read as a code
      # problem — which is, word for word, the failure rule #11 describes.
      #
      # Deriving it means there is one place the version lives, so bumping it stays
      # the deliberate commit the rule asks for. `tests/test_gating_tools_are_pinned.py`
      # refuses a literal version here, so this cannot quietly regress to a copy.
      - name: Install ruff (pin read from pyproject, so the gate cannot float)
        run: |
          python -m pip install --upgrade pip
          spec="$(python -c '
          import pathlib, tomllib
          dev = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"][
              "optional-dependencies"
          ]["dev"]
          print(next(d for d in dev if d.replace("-", "_").startswith("ruff")))
          ')"
          echo "pyproject pins: $spec"
          python -m pip install "$spec"

      - name: Lint (ruff check)
        run: ruff check src tests

      - name: Format check (ruff format --check)
        run: ruff format --check src tests

  # Static type-checking (added 2026-07-08). Strict def-typing is enforced
  # across the whole package (no per-module exclusions since 2026-07-19/20 —
  # see pyproject [tool.mypy]). Catches wrong attributes, bad return types, and
  # None-where-a-value-is-required. It needs the PySide6 wheel installed for its
  # bundled type stubs, but NOT the Qt SYSTEM libraries the `test` job installs —
  # mypy reads `.pyi` stubs and never imports Qt, so there's no apt step.
  typecheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev extras (mypy + PySide6 stubs)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type-check (mypy)
        run: mypy

  # Mechanical backstop for CLAUDE.md Critical Rule #7 ("Documentation currency
  # is part of Done"): fail a push/PR that lands with no CHANGELOG.md entry. The
  # real behaviour-changer is the always-loaded rule itself; this just catches a
  # slip. A pure historical-record commit (e.g. a docs/session-log catch-up that
  # legitimately has nothing user-facing to log) opts out with a "[skip changelog]"
  # line of its own in a commit message (or the marker in the PR title). Fast and
  # dependency-light.
  changelog:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # need the range's history to diff + read messages

      - name: Require a CHANGELOG entry (or an explicit opt-out)
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -euo pipefail
          # A manual run has no "change range" to police (no before/base sha),
          # so the changelog gate is meaningless here — skip it. The real gate
          # still runs on every push-to-main and PR.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch; no change range to police — skipping CHANGELOG check."
            exit 0
          fi
          # Dependency bumps are exempt: Dependabot can't add a CHANGELOG bullet
          # and the bump PR is itself the record. Detect it on the PR (the actor,
          # or the dependabot/* head branch) AND on the push-to-main merge commit
          # (its author, which a squash merge preserves) so neither surface goes
          # red. A human dep bump that wants an entry can still add one normally.
          case "${HEAD_REF:-}" in
            dependabot/*) is_dependabot=1 ;;
            *) is_dependabot=0 ;;
          esac
          if [ "$ACTOR" = "dependabot[bot]" ] \
              || [ "${HEAD_COMMIT_AUTHOR:-}" = "dependabot[bot]" ] \
              || [ "$is_dependabot" = "1" ]; then
            echo "Dependency bump (Dependabot); no CHANGELOG entry required — skipping."
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"; title="$PR_TITLE"
          else
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"; title=""
          fi
          # No real base to diff against (new ref / all-zero sha) → nothing to check.
          if printf '%s' "$base" | grep -qE '^0+$'; then
            echo "New ref with no base commit; skipping CHANGELOG check."
            exit 0
          fi
          # Opt-out: "[skip changelog]" in the PR title or ANY commit in the range.
          if printf '%s' "$title" | grep -qiF '[skip changelog]'; then
            echo "Opt-out via PR title; skipping."; exit 0
          fi
          # Match the marker only as its own (optionally indented) line, never a
          # prose mention — otherwise a commit that *documents* the marker opts
          # itself out. The marker is a deliberate standalone line.
          #
          # NB both greps below read from a HERE-STRING, never a pipe. Under
          # `set -o pipefail`, `producer | grep -q` is a race: `grep -q` exits the
          # instant it matches, the producer then dies of SIGPIPE (141), and
          # pipefail reports the whole *pipeline* as failed — so a match reads as
          # "no match". It only bites once the producer has more to write than the
          # pipe buffer swallows before grep exits, i.e. on a long commit range or
          # a big diff: exactly when these checks matter most. That silently ate a
          # legitimate `[skip changelog]` opt-out (2026-07-27, PR #99), and the
          # CHANGELOG.md check below had the same latent bug — it could have failed
          # a PR that *did* update the changelog. A here-string has no producer
          # process, so there is nothing to signal.
          messages="$(git log --format='%B' "$base..$head")"
          if grep -qiE '^[[:space:]]*\[skip changelog\][[:space:]]*$' <<<"$messages"; then
            echo "Opt-out via commit message; skipping."; exit 0
          fi
          # The check: does the range ADD a line to CHANGELOG.md?
          #
          # It used to ask only whether the FILE was touched — `grep -qx 'CHANGELOG.md'`
          # over `--name-only` — which is the label rather than the subject. A commit
          # that DELETED a bullet, reflowed whitespace, or fixed a typo satisfied a gate
          # whose whole purpose is "there is a new entry". Found by the 2026-08-18
          # enforcement audit; same shape as the release gate that printed "entries were
          # moved" while only checking that [Unreleased] was empty.
          #
          # `--unified=0` so context lines are not mistaken for additions, and the added
          # lines are filtered to non-blank ones: a commit that adds only a blank line to
          # the changelog has added no entry.
          added="$(git diff --unified=0 "$base" "$head" -- CHANGELOG.md \
                     | grep -E '^\+' | grep -vE '^\+\+\+' | sed 's/^\+//' \
                     | grep -cE '[^[:space:]]' || true)"
          if [ "${added:-0}" -gt 0 ]; then
            echo "CHANGELOG.md gained $added non-blank line(s). ✅"
          else
            touched=0
            if grep -qx 'CHANGELOG.md' <<<"$(git diff --name-only "$base" "$head")"; then
              touched=1
            fi
            if [ "$touched" = "1" ]; then
              echo "::error::CHANGELOG.md was modified but the change ADDS no content — a deletion or a whitespace edit is not an entry. Add a bullet to the [Unreleased] section (CLAUDE.md Critical Rule #7), or use a '[skip changelog]' line of its own for a pure historical-record commit."
            else
              echo "::error::No CHANGELOG.md entry for this change. Add a bullet to the [Unreleased] section in the same commit (CLAUDE.md Critical Rule #7), or put a '[skip changelog]' line of its own in the commit message for a pure historical-record commit."
            fi
            exit 1
          fi

  # Server-side backstop for CLAUDE.md Critical Rule #8 (never commit audio /
  # copyrighted media). `.githooks/pre-commit` is the client-side guard, but a
  # contributor without the hook installed — or a `git commit --no-verify` — could
  # still push audio to this PUBLIC repo. This makes the SERVER the authoritative
  # guard: fail any push/PR that introduces a file with an audio extension.
  media-guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # need the range's history to diff
      - name: Reject audio/copyrighted media (Critical Rule #8)
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Same audio-extension pattern as .githooks/pre-commit + .gitignore.
          pattern='\.(flac|wav|mp3|m4a|aac|ogg|oga|opus|wv|ape|wma|aiff|aif|alac|dsf|dff)$'
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"
          fi
          # THE PRODUCER IS CHECKED SEPARATELY FROM grep. `| grep ... || true`
          # needs the `|| true` for grep's no-match exit (the normal case), but
          # `|| true` sits outside the pipeline and so also absorbs a failure of
          # `git ls-files` / `git diff` themselves — `set -o pipefail` cannot help,
          # because it is the pipeline's own non-zero status being discarded. The
          # result is an empty `offenders`, a "No audio/media files. ✅", and a
          # green gate that inspected nothing: fail-OPEN on the one rule here with
          # legal consequences.
          #
          # This branch has the more reachable trigger of the two: after a
          # force-push `$PUSH_BEFORE` can name an object that no longer exists, at
          # which point `git diff` is fatal rather than empty.
          #
          # The identical idiom was in `.githooks/pre-commit`, which CLAUDE.md calls
          # "the canonical guard" — so the two guards meant to be INDEPENDENT
          # witnesses shared one failure mode, which is exactly what an independent
          # backstop is for. Found 2026-08-20; both fixed together.
          #
          # Manual run or a new ref with no base → scan the whole tree instead of a range.
          if [ "$EVENT" = "workflow_dispatch" ] || printf '%s' "$base" | grep -qE '^0+$'; then
            if ! candidates=$(git ls-files); then
              echo "::error::git ls-files failed, so this gate could not enumerate the tree. Refusing rather than reporting a clean scan it did not perform."
              exit 1
            fi
          else
            if ! candidates=$(git diff --name-only --diff-filter=ACMR "$base" "$head"); then
              echo "::error::git diff $base..$head failed (a force-push can leave \$PUSH_BEFORE naming a vanished object), so this gate could not enumerate the change. Refusing rather than reporting a clean scan it did not perform."
              exit 1
            fi
          fi
          offenders=$(printf '%s\n' "$candidates" | grep -iE "$pattern" || true)
          if [ -n "$offenders" ]; then
            echo "::error::Audio/copyrighted media must never be committed (CLAUDE.md Critical Rule #8). Offenders:"
            printf '%s\n' "$offenders" >&2
            exit 1
          fi
          echo "No audio/media files. ✅"

  # Dependency-vulnerability audit (2026-07-08 trust audit). Installs the project
  # and runs pip-audit against the resolved dependency graph — including the
  # self-declared-unmaintained musicbrainzngs. Gating: a new advisory turns CI
  # red so it can't slip in unnoticed. Escape hatch for an advisory with no fix
  # yet: append `--ignore-vuln <GHSA/PYSEC-id>` here with a reason + revisit date.
  pip-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project + pip-audit
        run: |
          # Upgrade setuptools alongside pip: it's a build-time tool the runner
          # ships (not a shipped runtime dep of the wheel), and a fresh advisory
          # (PYSEC-2026-3447) flags the runner's older setuptools. Pulling the
          # latest patched setuptools keeps the audit honest without suppressing
          # a real finding — the actual fix, not an --ignore-vuln.
          python -m pip install --upgrade pip setuptools
          python -m pip install -e . pip-audit
      - name: Audit dependencies
        run: pip-audit --progress-spinner=off

  # Advisory (never fails): warn when src/ changes without a matching tests/
  # change — a soft nudge toward "every change carries a test / every bug gets a
  # regression test", mirroring the changelog gate's range logic. It only emits a
  # GitHub ::warning:: and always exits 0, because plenty of legitimate src edits
  # (a comment, a rename, a docstring) need no new test.
  tests-touched:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a test change, or a stated reason
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"
          fi
          if [ "$EVENT" = "workflow_dispatch" ] || printf '%s' "$base" | grep -qE '^0+$'; then
            echo "No change range to check."; exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          src=$(printf '%s\n' "$changed" | grep -E '^src/platterpus/.*\.py$' || true)
          tst=$(printf '%s\n' "$changed" | grep -E '^tests/.*\.py$' || true)

          if [ -z "$src" ] || [ -n "$tst" ]; then
            echo "src/tests change balance OK. ✅"
            exit 0
          fi

          # ---- src/ changed with no tests/ change. Two legitimate cases, then a refusal.
          #
          # THIS JOB USED TO ONLY WARN, and CLAUDE.md filed it under "Advisory:
          # warns (never fails)". An enforcement audit (2026-08-20) measured the
          # consequence: "every shipped bug gets a regression test in the same
          # change" is the most-cited rule in the repo and had the WEAKEST
          # enforcement of any examined — a GitHub annotation with no `exit 1` on
          # any path. A warning in a log nobody reads is the same as nothing.
          #
          # It is gating now, and escapable BY SAYING WHY rather than by silence —
          # the allowlist-with-a-written-reason pattern used throughout this repo.
          # That is what keeps it from being a false-failure machine: an author who
          # genuinely needs no test always has the door, and has to name the reason
          # in the commit, where review can see it.

          # CASE 1 — a release commit. The version bump touches `__init__.py` and
          # nothing else in src/, and no test should change for it. Recognised
          # precisely (only that file, and only the `__version__` line) rather than
          # by exempting `__init__.py` wholesale, which would let real code through.
          only_init=$(printf '%s\n' "$src" | grep -vE '^src/platterpus/__init__\.py$' || true)
          if [ -z "$only_init" ]; then
            if ! init_diff=$(git diff -U0 "$base" "$head" -- src/platterpus/__init__.py); then
              echo "::error::could not diff __init__.py, so this gate cannot tell a version bump from a code change. Refusing rather than assuming."
              exit 1
            fi
            # Every added/removed line must be the version assignment.
            substantive=$(printf '%s\n' "$init_diff" \
              | grep -E '^[+-]' \
              | grep -vE '^(\+\+\+|---)' \
              | grep -vE '^[+-]__version__' || true)
            if [ -z "$substantive" ]; then
              echo "Version-bump-only change to __init__.py — no test expected. ✅"
              exit 0
            fi
          fi

          # CASE 2 — the author said why. Read the range's commit messages.
          if ! messages=$(git log --format=%B "$base..$head"); then
            echo "::error::could not read the range's commit messages, so this gate cannot find a justification. Refusing rather than passing."
            exit 1
          fi
          reason=$(printf '%s\n' "$messages" | grep -E '^\[no-test-needed\][[:space:]]*.+' || true)
          if [ -n "$reason" ]; then
            # Require a REASON, not just the marker — a bare tag is a blank cheque.
            text=$(printf '%s\n' "$reason" | sed -E 's/^\[no-test-needed\][[:space:]]*//' | head -1)
            if [ "${#text}" -lt 20 ]; then
              echo "::error::[no-test-needed] was given with no real reason (${#text} chars: '${text}'). Say what makes a test unnecessary or impossible here."
              exit 1
            fi
            echo "::warning::src/ changed with no test, justified: ${text}"
            echo "Justified. ✅"
            exit 0
          fi

          echo "::error::src/platterpus changed with NO change under tests/, and no justification given."
          printf '%s\n' "$src" | sed 's/^/    /'
          echo ""
          echo "CLAUDE.md, institutional and non-negotiable: every shipped bug gets a"
          echo "regression test in the same change, and it must fail before the fix."
          echo "Prove it with:  python3 scripts/revert_probe.py <spec.json>"
          echo ""
          echo "If a test genuinely is not the right answer here, add a line to a"
          echo "commit message in this range saying so, with the reason:"
          echo ""
          echo "    [no-test-needed] <why a test cannot or should not cover this>"
          exit 1

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Test across the Python versions our users actually run. We've been
        # bitten by version-specific breakage before (whipper's pkg_resources
        # use vs Python 3.14); a matrix catches the GUI side of that class of
        # problem early. 3.11 is the floor (pyproject `requires-python`); 3.14
        # (2025-10) is the newest — added 2026-07-02 (nothing the project uses
        # was removed in it; PySide6 6.11 supports it).
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags. TWO tests depend on this, and both SKIP rather
          # than fail without it — so a shallow clone would silently remove them:
          #   * tests/test_doc_version_stamps.py diffs docs against the latest
          #     release tag;
          #   * tests/test_check_script.py::test_the_coverage_floor_never_ratchets_down
          #     reads the coverage floor AT that tag, because a committed
          #     high-water constant is not a ratchet (whoever lowers the floor
          #     edits it in the same commit); the tagged value is the only one
          #     that cannot be rewritten.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6 imports a handful of system libraries even under the
      # "offscreen" Qt platform (no display needed). Install the minimal set;
      # without these the QApplication fixture in conftest.py fails to load.
      #
      # BOUNDED AND RETRIED, because this is the step that wedges. It stalled on
      # the GitHub runner four times across three runs of one branch, past 20
      # minutes each, with no bound at all — apt's own defaults let a mirror that
      # accepts the connection and then trickles hold a fetch open far longer than
      # the whole step is worth, and `apt-get` has no overall deadline of its own.
      #
      # Three things, each doing separate work:
      #   * `timeout` wraps EACH apt call, so a stalled fetch dies in minutes
      #     instead of consuming the job budget. It runs UNDER sudo rather than
      #     over it — `timeout sudo apt-get` signals sudo, which need not pass
      #     the signal on; `sudo timeout apt-get` parents apt directly.
      #   * the retry makes a transient stall self-heal inside the same run,
      #     instead of costing a re-run of the whole matrix.
      #   * `Acquire::*::Timeout` bounds apt internally too, so a stall is
      #     usually reported as a failed fetch (diagnosable) rather than
      #     silently killed from outside (not).
      #
      # WHERE THE NUMBERS COME FROM, because the first version got them wrong.
      # 240s per call was set to 75s while two matrix legs were still in flight,
      # calibrated against the two that had finished — 13s and 32s. The full run
      # measured 13s, 32s, 73s and 103s, ALL SUCCESSES. A 75s per-call bound sits
      # inside the healthy range and would have killed the slow-but-working leg.
      # A bound picked from the half of the sample that cannot disprove it is not
      # a measurement. 240s is >2x the slowest healthy WHOLE step, applied per
      # call, and still an order of magnitude below the 20-minute stalls.
      #
      # Two attempts, not three, and that is arithmetic rather than taste:
      # 2 x 2 calls x 240s + 15s backoff = 975s, so the 18-minute step bound
      # holds with room, and the 30-minute job bound still has ~13 minutes for
      # the ~4.5-minute test step. Three attempts at this timeout would be 24.5
      # minutes and would not fit.
      - name: Install headless Qt system libraries
        timeout-minutes: 18
        run: |
          set -euo pipefail
          # Word splitting here is intended, so an array rather than a string.
          opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20
                -o Acquire::https::Timeout=20)
          for attempt in 1 2; do
            # `if`, not a bare call: `set -e` would abort the loop on the first
            # failed attempt and the retry would never happen.
            echo "::group::apt attempt ${attempt}"
            if sudo timeout -k 10 240 apt-get "${opts[@]}" update \
               && sudo timeout -k 10 240 apt-get "${opts[@]}" install -y \
                    --no-install-recommends \
                    libegl1 libgl1 libglib2.0-0 libxkbcommon0 \
                    libdbus-1-3 libfontconfig1 libfreetype6; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            # Named, because "the apt step failed" is not diagnosable and the
            # attempt number separates a stalled mirror from a broken package
            # list: a stall fails both attempts the same way, a real error fails
            # attempt 1 instantly.
            echo "::warning::apt attempt ${attempt} failed or timed out"
            # No sleep after the last attempt — it would only delay the failure.
            [ "${attempt}" -eq 2 ] || sleep 15
          done
          echo "::error::could not install the headless Qt libraries in 2 attempts"
          exit 1

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run with branch coverage and a hard floor. The gate ratchets up as
      # the suite grows — raise --cov-fail-under when TOTAL comfortably clears
      # it; never lower it to make a red build pass.
      #
      # A single clean pass. The offscreen-Qt/PySide *process abort* that used to
      # flake this matrix (SIGSEGV/SIGABRT) was a wrong-thread QObject destruction
      # in the pending-installs dialog — fixed at the root (see the 2026-07 entry
      # in docs/testing.md), so the retry-on-abort wrapper that masked it is gone.
      # `timeout-minutes` is a cheap backstop: if a future regression hangs the
      # suite, the job fails in minutes instead of burning the 6-hour default.
      # NOTE: no `-q` here. `addopts` in pyproject.toml already passes one, and a
      # second took verbosity to -2, which suppresses pytest's `N passed` summary
      # line. That mattered more than it looks: the summary is the only
      # human-visible proof in the log that the run *reached the end*, so its
      # absence looked normal and hid a run that died at 76% (2026-07-29).
      - name: Run tests (with coverage gate)
        env:
          QT_QPA_PLATFORM: offscreen
        timeout-minutes: 15
        run: >-
          pytest
          --cov=platterpus
          --cov-report=term-missing
          --cov-fail-under=91

      # The exit code above is NOT sufficient on its own. conftest.py ends the
      # session with `os._exit(status)` (to dodge a PySide teardown abort), so any
      # `os._exit(0)` reached from product code mid-run is indistinguishable from
      # success: status 0, no summary, no coverage report, and `--cov-fail-under`
      # never evaluated. That exact thing happened — a test drove the
      # update-relaunch path into the real `os._exit`, the suite stopped at 76%,
      # and this job went green (2026-07-29).
      #
      # A truncated run cannot detect itself, so the check has to live outside it:
      # `pytest_sessionfinish` writes this file as its very last act, and a run
      # that vanished simply never wrote it.
      - name: Confirm the suite actually finished
        run: |
          if [ ! -f .pytest-session-complete ]; then
            echo "::error::The pytest session never reached session-finish."
            echo "Something ended the process mid-run — most likely product code"
            echo "calling os._exit (see platterpus.hard_exit and the autouse"
            echo "hard_exit_calls fixture in tests/conftest.py). The exit status"
            echo "of the step above is meaningless: results were never tallied and"
            echo "the coverage gate never ran."
            exit 1
          fi
          echo "Session completed; recorded exit status: $(cat .pytest-session-complete)"
