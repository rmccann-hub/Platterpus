name: CI

# Run the test suite on every push to main and every pull request, so
# regressions are caught before they land. This is the same `pytest` that
# passes locally — the suite needs no CD hardware (cyanrip/MusicBrainz/Qt are
# all faked or run headless).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow a manual run on any branch. Pushes and PRs made with a GitHub App
  # installation token do NOT trigger `push`/`pull_request` workflows (GitHub's
  # recursion guard), and `workflow_dispatch` is honoured for them, so this is the
  # escape hatch for that case. It is NOT every cloud session: this project's
  # sessions push as the maintainer's account and do trigger CI (measured
  # 2026-09-27, run 36333047088 for PR #266).
  workflow_dispatch:

# Least privilege: every job here only READS the repo (lint / test / changelog /
# media-guard). The default GITHUB_TOKEN is broad (contents: write, etc.), so pin
# it down — a compromised action pulled into CI then can't push, tag, or open
# PRs. The release/publish workflows declare their own (wider) permissions where
# they actually need them.
permissions:
  contents: read

# A NEWER PUSH TO A PULL REQUEST CANCELS ITS OLDER RUN; NOTHING ELSE IS CANCELLED
# (the 2026-10-27 review, item 2.7). A superseded pull-request run only burns
# runner minutes: its result describes a head nobody will merge.
#
# A push to `main` must never be cancelled, and must never wait in a shared
# group either: `release.yml`'s CI gate reads `main`'s own run for the merge
# SHA it releases, and GitHub keeps at most ONE pending run per concurrency
# group, cancelling any older pending one whatever `cancel-in-progress` says. A
# group shared by `main`'s pushes would therefore cancel the run of a merge that
# landed while another was running. So every run that is not a pull request gets
# a group of its own (`github.run_id`), which nothing can supersede, and
# `cancel-in-progress` is true for pull requests alone. Held by
# `tests/test_ci_workflow_shape.py`.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# EVERY CHECKOUT HERE SETS `persist-credentials: false` (the 2026-10-27 review,
# item 1.4). By default actions/checkout leaves the token in the clone's git
# config for every later step to use, so any step, or any tool a step installs,
# could read it. No job in this file pushes. The jobs that fetch after checkout
# (`changelog`, `media-guard`, `tests-touched`, `test`) fetch from this PUBLIC
# repository, which needs no token; `gitleaks` takes every branch, `evidence`
# included, in the checkout itself, which uses the token whatever this says; and
# `scripts/laplang/evidence.py` fetches into a temporary repository of its own,
# which never saw the persisted token anyway. Held by
# `tests/test_ci_workflow_shape.py`.

jobs:
  # Lint + format check. Fast and dependency-light (ruff is a single binary,
  # no Qt libs needed), so it runs as its own job in parallel with the tests.
  lint:
    runs-on: ubuntu-22.04
    # A JOB-LEVEL bound, not just a step-level one. `Run tests` already carries
    # `timeout-minutes: 15` with the right reasoning written beside it — "fails in
    # minutes instead of burning the 6-hour default" — but it was applied to the step
    # the author was thinking about rather than to the surface the rule belongs on.
    # The step that has actually wedged is `Install headless Qt system libraries`: an
    # apt stall on the runner hung two jobs for 20+ minutes on 2026-08-18, twice, with
    # no bound at all and no way to tell a hang from slowness. That is this session's
    # recurring shape — a guard scoped to where a problem was expected — so the bound
    # now covers every step, including the ones nobody has seen fail yet.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        # Depth 1, the default (HR-2 §8b): ruff reads the tree and never history.
        # The comment that stood here explained why the TEST job needs history; it
        # was copied with the setting, and the setting fetched the whole history for
        # a linter that reads none of it.

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # Never a version written here: one place chooses ruff's range.
      #
      # This step used to install `ruff>=0.15,<1` — the whole 0.x line — while
      # `[project.optional-dependencies].dev` pinned `>=0.15.22,<0.16`. So the
      # constraint CLAUDE.md Critical rule #11 exists to impose ("a tool that gates
      # CI must not float") was written down in the file that does NOT gate, and
      # absent from the one that does. A routine ruff 0.16 release would have turned
      # this job red with zero change to our code, and it would have read as a code
      # problem — which is, word for word, the failure rule #11 describes.
      # `tests/test_gating_tools_are_pinned.py` refuses a literal version here.
      #
      # Since 2026-10-29 the job installs build/locks/lint.lock: ruff alone,
      # resolved from the dev extra's range at the same date as ci.lock, so the
      # same ruff the `test` and `typecheck` jobs install
      # (`tests/test_dependency_locks.py` holds the two versions equal, and fails
      # when either lock leaves pyproject's range). From 2026-10-27 it installed
      # ci.lock whole, PySide6's 175 MB of wheels included, to run one tool; on
      # 0.7.116's merge commit that download ran at 186 kB/s and the job hit its
      # 15-minute bound with ruff never run. Before 2026-10-27 this step read
      # ruff's range out of pyproject and installed whatever PyPI served in it.
      - name: Install ruff from its hashed lock (the gate cannot float)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r build/locks/lint.lock

      - name: Lint (ruff check)
        run: ruff check src tests scripts build

      - name: Format check (ruff format --check)
        run: ruff format --check src tests scripts build

  # Static type-checking (added 2026-07-08). Strict def-typing is enforced
  # across the whole package (no per-module exclusions since 2026-07-19/20 —
  # see pyproject [tool.mypy]), and since 2026-10-05 across `scripts/` and
  # `build/*.py` too, from the same `files` list. Catches wrong attributes, bad
  # return types, and None-where-a-value-is-required. It needs the PySide6
  # wheel installed for its
  # bundled type stubs, but NOT the Qt SYSTEM libraries the `test` job installs —
  # mypy reads `.pyi` stubs and never imports Qt, so there's no apt step.
  typecheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # The hashed CI lock (see the lint job), then the project itself with no
      # index, no dependencies and no build isolation, so nothing but the lock
      # reaches PyPI: the editable build uses the setuptools the lock installed.
      - name: Install package with dev extras (mypy + PySide6 stubs)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r build/locks/ci.lock
          python -m pip install --no-index --no-deps --no-build-isolation -e .

      - name: Type-check (mypy)
        run: mypy

  # Mechanical backstop for CLAUDE.md Critical Rule #7 ("Documentation currency
  # is part of Done"): fail a push/PR that lands with no CHANGELOG.md entry. The
  # real behaviour-changer is the always-loaded rule itself; this just catches a
  # slip. A pure historical-record commit (e.g. a docs/session-log catch-up that
  # legitimately has nothing user-facing to log) opts out with a "[skip changelog]"
  # line of its own in a commit message (or the marker in the PR title). Fast and
  # dependency-light.
  changelog:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
      # HR-2 §8b: fetch only what this job reads, by explicit refspec. Depth 1 and
      # blobless above, then the full history of HEAD and of main, still without
      # file contents: a range diff fetches the blobs it reads on demand. All
      # branches are NOT fetched, so the `evidence` branch never comes along.
      - name: Fetch HEAD's and main's history, blobless, by refspec (HR-2 §8b)
        run: |
          set -euo pipefail
          deepen=()
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then deepen=(--unshallow); fi
          git fetch --no-tags "${deepen[@]}" --filter=blob:none origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - name: Require a CHANGELOG entry (or an explicit opt-out)
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # A manual run has no "change range" to police (no before/base sha),
          # so the changelog gate is meaningless here — skip it. The real gate
          # still runs on every push-to-main and PR.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch; no change range to police — skipping CHANGELOG check."
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"; title="$PR_TITLE"
          else
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"; title=""
          fi
          # No real base to diff against (new ref / all-zero sha) → nothing to check.
          if printf '%s' "$base" | grep -qE '^0+$'; then
            echo "New ref with no base commit; skipping CHANGELOG check."
            exit 0
          fi
          # Dependency bumps are exempt: Dependabot can't add a CHANGELOG bullet
          # and the bump PR is itself the record. On a PR it is the PR's AUTHOR or
          # its dependabot/* head branch, never `github.actor`, which is whoever
          # last re-ran the job. On a push to main it is the COMMITS the push
          # brings in: every non-merge commit in the range authored by Dependabot.
          # This used to read the head commit's author, which a squash merge kept
          # as Dependabot; since 2026-10-12 the repository merges with merge
          # commits only, and a merge commit's author is whoever merged, so that
          # key would have turned main red on every Dependabot merge. The range's
          # own commits are the same answer under either merge method. A human dep
          # bump that wants an entry can still add one normally.
          case "${HEAD_REF:-}" in
            dependabot/*) is_dependabot=1 ;;
            *) is_dependabot=0 ;;
          esac
          if [ "$EVENT" = "pull_request" ] && [ "${PR_AUTHOR:-}" = "dependabot[bot]" ]; then
            is_dependabot=1
          fi
          if [ "$EVENT" = "push" ]; then
            # Here-string, not a pipe: see the NB on the greps below.
            authors="$(git log --no-merges --format='%an' "$base..$head")"
            if [ -n "$authors" ] \
                && ! grep -qvxF 'dependabot[bot]' <<<"$authors"; then
              is_dependabot=1
            fi
          fi
          if [ "$is_dependabot" = "1" ]; then
            echo "Dependency bump (Dependabot); no CHANGELOG entry required — skipping."
            exit 0
          fi
          # Opt-out: "[skip changelog]" in the PR title or ANY commit in the range.
          if printf '%s' "$title" | grep -qiF '[skip changelog]'; then
            echo "Opt-out via PR title; skipping."; exit 0
          fi
          # Match the marker only as its own (optionally indented) line, never a
          # prose mention — otherwise a commit that *documents* the marker opts
          # itself out. The marker is a deliberate standalone line.
          #
          # NB both greps below read from a HERE-STRING, never a pipe. Under
          # `set -o pipefail`, `producer | grep -q` is a race: `grep -q` exits the
          # instant it matches, the producer then dies of SIGPIPE (141), and
          # pipefail reports the whole *pipeline* as failed — so a match reads as
          # "no match". It only bites once the producer has more to write than the
          # pipe buffer swallows before grep exits, i.e. on a long commit range or
          # a big diff: exactly when these checks matter most. That silently ate a
          # legitimate `[skip changelog]` opt-out (2026-07-27, PR #99), and the
          # CHANGELOG.md check below had the same latent bug — it could have failed
          # a PR that *did* update the changelog. A here-string has no producer
          # process, so there is nothing to signal.
          messages="$(git log --format='%B' "$base..$head")"
          if grep -qiE '^[[:space:]]*\[skip changelog\][[:space:]]*$' <<<"$messages"; then
            echo "Opt-out via commit message; skipping."; exit 0
          fi
          # The check: does the range ADD a line to CHANGELOG.md?
          #
          # It used to ask only whether the FILE was touched — `grep -qx 'CHANGELOG.md'`
          # over `--name-only` — which is the label rather than the subject. A commit
          # that DELETED a bullet, reflowed whitespace, or fixed a typo satisfied a gate
          # whose whole purpose is "there is a new entry". Found by the 2026-08-18
          # enforcement audit; same shape as the release gate that printed "entries were
          # moved" while only checking that [Unreleased] was empty.
          #
          # `--unified=0` so context lines are not mistaken for additions, and the added
          # lines are filtered to non-blank ones: a commit that adds only a blank line to
          # the changelog has added no entry.
          added="$(git diff --unified=0 "$base" "$head" -- CHANGELOG.md \
                     | grep -E '^\+' | grep -vE '^\+\+\+' | sed 's/^\+//' \
                     | grep -cE '[^[:space:]]' || true)"
          if [ "${added:-0}" -gt 0 ]; then
            echo "CHANGELOG.md gained $added non-blank line(s). ✅"
          else
            touched=0
            if grep -qx 'CHANGELOG.md' <<<"$(git diff --name-only "$base" "$head")"; then
              touched=1
            fi
            if [ "$touched" = "1" ]; then
              echo "::error::CHANGELOG.md was modified but the change ADDS no content — a deletion or a whitespace edit is not an entry. Add a bullet to the [Unreleased] section (CLAUDE.md Critical Rule #7), or use a '[skip changelog]' line of its own for a pure historical-record commit."
            else
              echo "::error::No CHANGELOG.md entry for this change. Add a bullet to the [Unreleased] section in the same commit (CLAUDE.md Critical Rule #7), or put a '[skip changelog]' line of its own in the commit message for a pure historical-record commit."
            fi
            exit 1
          fi

  # Server-side backstop for CLAUDE.md Critical Rule #8 (never commit audio /
  # copyrighted media). `.githooks/pre-commit` is the client-side guard, but a
  # contributor without the hook installed — or a `git commit --no-verify` — could
  # still push audio to this PUBLIC repo. This makes the SERVER the authoritative
  # guard: fail any push/PR that introduces a file with an audio extension.
  media-guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
      # HR-2 §8b: fetch only what this job reads, by explicit refspec. Depth 1 and
      # blobless above, then the full history of HEAD and of main, still without
      # file contents: a range diff fetches the blobs it reads on demand. All
      # branches are NOT fetched, so the `evidence` branch never comes along.
      - name: Fetch HEAD's and main's history, blobless, by refspec (HR-2 §8b)
        run: |
          set -euo pipefail
          deepen=()
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then deepen=(--unshallow); fi
          git fetch --no-tags "${deepen[@]}" --filter=blob:none origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
      - name: Reject audio/copyrighted media (Critical Rule #8)
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # THE EXTENSION LIST IS READ FROM ONE FILE, `.githooks/audio-extensions.txt`,
          # which `.githooks/pre-commit` reads too, so the two guards cannot drift
          # apart (`tests/test_media_guard_hook.py` compares them with the agent-side
          # hook's list). One lowercase extension per line, no dot. A missing, empty
          # or malformed file REFUSES: a guard with no list would match nothing and
          # report a clean scan it never performed.
          ext_file=.githooks/audio-extensions.txt
          if [ ! -s "$ext_file" ]; then
            echo "::error::$ext_file is missing or empty, so this gate has no list of audio extensions to match. Refusing rather than reporting a clean scan."
            exit 1
          fi
          if grep -qvE '^[a-z0-9]+$' "$ext_file"; then
            echo "::error::$ext_file holds a line that is not one lowercase extension (letters and digits, no dot). Refusing rather than guessing what it meant:"
            grep -nvE '^[a-z0-9]+$' "$ext_file" >&2 || true
            exit 1
          fi
          pattern="\.($(paste -sd'|' "$ext_file"))\$"
          echo "audio extensions ($(wc -l < "$ext_file")): $pattern"
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"
          fi
          # NUL-SEPARATED NAMES, NEVER LINES (the 2026-10-27 review, item 1.1). With
          # `core.quotePath` on (git's default), a name outside ASCII is printed
          # quoted and octal-escaped: `Björk.flac` comes out as "Bj\303\266rk.flac"
          # with a closing quote, so `\.flac$` never matched it and this gate passed
          # the file. `-z` prints every name raw and NUL-terminated, and `grep -z`
          # matches each NUL-terminated record whole, so a quote, an escape or a
          # newline inside a name cannot hide the extension.
          #
          # THE PRODUCER IS CHECKED SEPARATELY FROM grep. A pipe into
          # `grep ... || true` would absorb a failure of `git ls-files` / `git diff`
          # along with grep's no-match exit, and a fatal producer would read as
          # "No audio/media files. ✅": fail-OPEN on the one rule here with legal
          # consequences (found 2026-08-20; the hook had the identical idiom). So the
          # names go to a file, the producer's own status is read, and only grep's
          # exit 1 (no match) counts as clean; its exit 2 (an error) refuses.
          #
          # The range branch has the more reachable trigger: after a force-push
          # `$PUSH_BEFORE` can name an object that no longer exists, at which point
          # `git diff` is fatal rather than empty.
          names="$(mktemp)"
          offenders="$(mktemp)"
          # Manual run or a new ref with no base → scan the whole tree instead of a range.
          if [ "$EVENT" = "workflow_dispatch" ] || printf '%s' "$base" | grep -qE '^0+$'; then
            if ! git ls-files -z > "$names"; then
              echo "::error::git ls-files failed, so this gate could not enumerate the tree. Refusing rather than reporting a clean scan it did not perform."
              exit 1
            fi
          else
            if ! git diff -z --name-only --diff-filter=ACMR "$base" "$head" > "$names"; then
              echo "::error::git diff $base..$head failed (a force-push can leave \$PUSH_BEFORE naming a vanished object), so this gate could not enumerate the change. Refusing rather than reporting a clean scan it did not perform."
              exit 1
            fi
          fi
          echo "names examined: $(tr -cd '\0' < "$names" | wc -c)"
          status=0
          grep -z -iE "$pattern" "$names" > "$offenders" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::grep exited $status while matching the names, so this gate cannot say whether any is audio. Refusing."
            exit 1
          fi
          if [ "$status" -eq 0 ]; then
            echo "::error::Audio/copyrighted media must never be committed (CLAUDE.md Critical Rule #8). Offenders:"
            tr '\0' '\n' < "$offenders" >&2
            exit 1
          fi
          echo "No audio/media files. ✅"

  # Dependency-vulnerability audit (2026-07-08 trust audit). Gating: a new
  # advisory turns CI red so it can't slip in unnoticed — including one against
  # the self-declared-unmaintained musicbrainzngs. Escape hatch for an advisory
  # with no fix yet: append `--ignore-vuln <GHSA/PYSEC-id>` here with a reason +
  # revisit date.
  #
  # WHAT IT AUDITS (changed 2026-10-27, the review's follow-up to items 2.1 and
  # 2.3): every committed lock, read as text with `--disable-pip`. Nothing it
  # audits is installed. Until then it installed the project by RANGE and audited
  # that environment, which was the newest release each range allowed on the day,
  # on Python 3.11 — neither what the AppImage bundles (CPython 3.12, fixed by
  # build/python-appimage/requirements.lock) nor what the release and publish
  # jobs run. The locks are both, exactly. What this gives up is the
  # newest-in-range view a fresh `pipx install` gets; a lock regenerated by
  # build/lock-requirements.sh is that view on the day it is regenerated.
  pip-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      # pip-audit at an EXACT version, VERIFIED BY HASH: it was pinned to a minor
      # range read from pyproject's dev extra (the review, item 2.2), which still
      # installs whatever patch release PyPI serves that minute. build/locks/
      # audit.lock is resolved from that same dev-extra line, so pyproject stays
      # the one place the range is chosen, and tests/test_dependency_locks.py
      # holds the lock inside it.
      - name: Install pip-audit from its hashed lock
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r build/locks/audit.lock
      - name: Audit every lock
        run: |
          shopt -s nullglob
          locks=(build/python-appimage/requirements.lock build/locks/*.lock)
          shopt -u nullglob
          # A floor, so an audit that found no locks cannot pass as a clean one:
          # the AppImage's lock, the three tool locks, the CI lock, and the sbom,
          # ci-lint and lint locks.
          if [ "${#locks[@]}" -lt 8 ]; then
            echo "::error::expected at least 8 locks to audit, found ${#locks[@]}: ${locks[*]}"
            exit 1
          fi
          args=()
          for lock in "${locks[@]}"; do args+=(-r "$lock"); done
          echo "auditing: ${locks[*]}"
          pip-audit --progress-spinner=off --disable-pip --require-hashes "${args[@]}"

  # THE LOCKS ARE WHAT THEIR HEADERS SAY PRODUCED THEM (the follow-up review of
  # 2026-10-27). Each lock records the uv version and the `--exclude-newer` date
  # build/lock-requirements.sh resolved it with, and `--check` regenerates every
  # lock from those two fields and diffs it against the committed file. That is
  # the check that sees a hand edit: a package deleted from release.lock still
  # parses and still sits inside pyproject's ranges, so tests/
  # test_dependency_locks.py passes it, and here the diff shows the missing
  # lines. It also goes red when PyPI yanks or removes a release a lock pins,
  # which is worth knowing too. Needs PyPI, and nothing else.
  #
  # uv at the version dependencies.yml pins, which must be the one the locks'
  # headers name (tests/test_dependency_locks.py holds the three equal). No cache:
  # the check is about what PyPI serves today.
  #
  # NOT a required status check: the owner adds it to the default-branch ruleset
  # when they choose to (PLANNING.md KDD-43).
  lock-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The generator reads pyproject.toml with tomllib, which needs 3.11.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Regenerate every lock and diff it against the committed file
        run: bash build/lock-requirements.sh --check

  # EVERY LOCK INSTALLS, AND THE BUILDS RUN, BEFORE A RELEASE NEEDS THEM (the
  # follow-up review of 2026-10-27, item 4). No pull request installed
  # publish.lock, which publish-pypi.yml first met at publish time, and
  # release.lock and the AppImage's lock were first installed by appimage.yml on
  # main. So a lock that could not install, or a build it could not run,
  # surfaced at the release. This job installs each lock into a clean venv of
  # its own with `--require-hashes --only-binary=:all:`, runs `pip check` on
  # each, then runs what the consuming job runs, short of anything that
  # publishes: publish-pypi.yml's build and `twine check`, build_appimage.sh's
  # wheel build, and each tool's own version line. ci.lock is not repeated
  # here: the test, lint and typecheck jobs install it on every pull request.
  #
  # The AppImage's lock is for the CPython the AppImage bundles (3.12), so it
  # gets a 3.12 venv; everything else gets 3.11, as the jobs that use it do.
  # No secrets, no token, no cache: a clean install is the point.
  #
  # NOT a required status check yet: the owner adds it to the default-branch
  # ruleset when they choose to (PLANNING.md KDD-43).
  lock-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Two interpreters: the last one listed is the default `python`.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.12
            3.11
      - name: Install each lock into a clean venv, hashed, and pip check it
        run: |
          set -euo pipefail
          v="$RUNNER_TEMP/venvs"
          for name in release publish audit sbom ci-lint; do python3.11 -m venv "$v/$name"; done
          python3.12 -m venv "$v/appimage"
          "$v/release/bin/python" -m pip install --require-hashes --only-binary=:all: -r build/locks/release.lock
          "$v/publish/bin/python" -m pip install --require-hashes --only-binary=:all: -r build/locks/publish.lock
          "$v/audit/bin/python" -m pip install --require-hashes --only-binary=:all: -r build/locks/audit.lock
          "$v/sbom/bin/python" -m pip install --require-hashes --only-binary=:all: -r build/locks/sbom.lock
          "$v/ci-lint/bin/python" -m pip install --require-hashes --only-binary=:all: -r build/locks/ci-lint.lock
          "$v/appimage/bin/python" -m pip install --require-hashes --only-binary=:all: -r build/python-appimage/requirements.lock
          for name in release publish audit sbom ci-lint appimage; do
            echo "pip check: $name"
            "$v/$name/bin/python" -m pip check
          done
      - name: Build the wheel and sdist and check them, as publish-pypi.yml does, without publishing
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/venvs/publish/bin/python"
          "$py" -m build --no-isolation --outdir "$RUNNER_TEMP/dist-publish"
          "$py" -m twine check "$RUNNER_TEMP"/dist-publish/*
      - name: Build the wheel as build_appimage.sh does, from the release lock
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/venvs/release/bin/python"
          "$py" -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/dist-release"
          ls -l "$RUNNER_TEMP/dist-release"
          "$py" -m python_appimage --help > /dev/null
          "$py" -m sigstore --version
      # actionlint is NOT run here: ci-lint.lock leaves actionlint-py out, because
      # it ships only an sdist and the lock takes wheels only (TASKS R91). The
      # first run of this job, on PR #401, failed on exactly that line;
      # tests/test_dependency_locks.py now holds every tool run here to a package
      # its lock pins.
      - name: Run each tool the other locks install
        run: |
          set -euo pipefail
          v="$RUNNER_TEMP/venvs"
          "$v/audit/bin/pip-audit" --version
          "$v/sbom/bin/cyclonedx-py" --version
          "$v/ci-lint/bin/zizmor" --version
          "$v/ci-lint/bin/shellcheck" --version

  # SECRET SCANNING. Gitleaks over the FULL HISTORY, not just the diff.
  #
  # This repository is public and its git history is public with it. A credential
  # committed and then removed in a later commit is still published — `git log`
  # is the distribution channel, which is the same reasoning Critical rule #8
  # gives for audio: *"a public commit (and git history) is redistribution."*
  # Scanning only the PR diff would pass on exactly that case.
  #
  # GATING, not advisory. A leaked key is not a style opinion, and the whole
  # point of the `.claude/settings.json` deny rules on `.env*`/`secrets/**` is
  # that nothing in this repo should ever hold one — so a finding here means
  # either a real leak or a rule that needs writing, and both want a red build.
  gitleaks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history. A shallow clone would make this check pass by not
          # looking, which is the failure mode this repo names most often.
          fetch-depth: 0
      - name: Install gitleaks (version pinned, checksum verified)
        # The CLI, not `gitleaks/gitleaks-action`. The action scans a range it builds
        # itself, `--no-merges --first-parent <first>^..<head>`, so a session-branch
        # pull request merged with a merge commit gave `main`'s push run "0 commits
        # scanned" and a green job, and no run ever read a merge commit's own change
        # (the 2026-09-28 configuration audit, amendment A12, `PLANNING.md` KDD-39;
        # released from the C3 freeze on 2026-10-05, KDD-41).
        #
        # Pinned like a gating tool (Critical rule #11): the version and the
        # tarball's sha256 from the release's own `gitleaks_<v>_checksums.txt`, so a
        # changed or substituted download fails here instead of scanning. 8.24.3 is
        # the binary the action ran, read from `main`'s CI log on 2026-09-28, so this
        # change alters what is scanned, not which scanner scans it.
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict -
          tar -xzf "$tarball" gitleaks
          test "$(./gitleaks version)" = "${GITLEAKS_VERSION}"
      - name: Scan every commit, merge commits included
        env:
          MIN_COMMITS_SCANNED: "1500"
        # `-m` diffs a merge commit against EACH parent, so a merge's own change and
        # history that reaches `main` as a merge's second parent are both read.
        #
        # THREE FLOORS, because a scan that reads nothing reports "no leaks found" too,
        # which is exactly how the action passed on 0 commits:
        # 1. the clone must not be shallow. A relative floor alone is not enough: in a
        #    shallow clone `git rev-list` counts only the commits the clone has, so a
        #    depth-5 clone "scanned 8 of 8" and passed when this was first tried;
        # 2. at least MIN_COMMITS_SCANNED commits, an absolute number that a clone
        #    which sees too little cannot follow down. History only grows here (the
        #    proxy refuses a force push), and 1,636 were scanned on 2026-10-05;
        # 3. at least 90 % of the commits reachable from HEAD. Not 100 %: gitleaks
        #    counts only commits that carry a patch, and an empty commit carries none
        #    (2026-10-05: 1,636 of 1,692, 96.7 %, no leaks).
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::The clone is shallow, so a full-history scan cannot be one. Check out with fetch-depth: 0."
            exit 1
          fi
          reachable="$(git rev-list --count HEAD)"
          floor=$(( reachable * 90 / 100 ))
          if [ "$floor" -lt "$MIN_COMMITS_SCANNED" ]; then floor="$MIN_COMMITS_SCANNED"; fi
          set +e
          ./gitleaks git --log-opts="-m HEAD" --redact --no-banner --no-color . 2>&1 | tee gitleaks.log
          status="${PIPESTATUS[0]}"
          set -e
          scanned="$(sed -n 's/.* \([0-9][0-9]*\) commits scanned\..*/\1/p' gitleaks.log | tail -n 1)"
          echo "commits reachable from HEAD: ${reachable}; scanned: ${scanned:-none}; floor: ${floor}"
          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks exited ${status}. A finding is a real leak or a rule to write; see the log above (secrets redacted)."
            exit "$status"
          fi
          if [ -z "$scanned" ] || [ "$scanned" -lt "$floor" ]; then
            echo "::error::gitleaks scanned ${scanned:-no} commits of ${reachable} reachable, below the floor of ${floor}. A scan that reads too little passes by not looking, so this job refuses it."
            exit 1
          fi

      # HR-2 §8a: this is the ONE job that fetches the `evidence` branch (the
      # checkout above takes every branch). It scans it for secrets, checks every
      # manifest row added in this change against its file at its commit, checks
      # the branch's shape and that no tag reaches it, and re-checks every lap that
      # cites evidence, with fetch failures fatal (HR2_EVIDENCE_STRICT=1). Before
      # the first move there is no branch and no manifest, and each step says so
      # rather than passing silently.
      - name: Scan the evidence branch (HR-2 §8a)
        run: |
          set -euo pipefail
          ref=refs/remotes/origin/evidence
          if ! git rev-parse --verify --quiet "$ref" >/dev/null; then
            echo "no evidence branch on origin yet: nothing to scan"
            exit 0
          fi
          commits="$(git rev-list --count "$ref")"
          set +e
          ./gitleaks git --log-opts="$ref" --redact --no-banner --no-color . 2>&1 | tee gitleaks-evidence.log
          status="${PIPESTATUS[0]}"
          set -e
          scanned="$(sed -n 's/.* \([0-9][0-9]*\) commits scanned\..*/\1/p' gitleaks-evidence.log | tail -n 1)"
          echo "evidence commits: ${commits}; scanned: ${scanned:-none}"
          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks exited ${status} on the evidence branch; see the log above (secrets redacted)."
            exit "$status"
          fi
          # Every evidence commit adds files (HR-2 §3), so every one carries a patch.
          if [ -z "$scanned" ] || [ "$scanned" -lt "$commits" ]; then
            echo "::error::gitleaks scanned ${scanned:-no} of ${commits} evidence commits."
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check the evidence manifest, branch, tags and citing laps (HR-2 §8a)
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HR2_EVIDENCE_STRICT: "1"
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          python3 scripts/evidence_manifest.py format --base "$base"
          python3 scripts/evidence_manifest.py rows --since "$base"
          python3 scripts/evidence_manifest.py branch
          python3 scripts/evidence_manifest.py tags
          python3 scripts/evidence_manifest.py laps
          # HR-2.1 b: before the removal merges, each moved folder still on the
          # default branch must equal its tree at the evidence commit.
          python3 scripts/evidence_manifest.py unchanged --ref origin/main

  # SBOM. A machine-readable inventory of what actually ships, in CycloneDX.
  #
  # Built on every push rather than only at release, because an SBOM produced
  # once a release is a claim nobody has checked between releases — and because
  # the interesting failure is a dependency arriving unnoticed, which is a
  # per-commit event. Uploaded as an artifact here; `release.yml` attaches the
  # release build's copy to the GitHub Release.
  sbom:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      # A REQUIRED job, so its installs are hashed like the other gates' (the
      # follow-up review of 2026-10-27, item 5; amendment A5's other half). It
      # ran `pip install --upgrade pip` and `-e . "cyclonedx-bom>=7,<8"`: whatever
      # PyPI served that minute, unhashed. build/locks/sbom.lock is the runtime
      # dependencies, pyproject's `sbom` extra and the build backend, resolved by
      # build/lock-requirements.sh; then the project, offline, with no
      # dependencies and no isolated build, as the test job installs it. The SBOM
      # therefore describes exactly the locked runtime closure plus the generator.
      - name: Install the project and cyclonedx-bom from the hashed sbom lock
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r build/locks/sbom.lock
          python -m pip install --no-index --no-deps --no-build-isolation -e .
      - name: Generate the SBOM
        run: |
          # `--output-file`, NOT `--outfile`, and the flag belongs to the
          # SUBCOMMAND. The first version of this job used `--outfile` and failed
          # in 24 seconds with "unrecognized arguments" — a CI step written
          # against a flag nobody had run, which is the `-V` blocker's exact
          # class: a flag that does not exist is indistinguishable, from the
          # caller's side, from a tool that is broken. Verified locally before
          # this line was written the second time (101 components).
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      # A FLOOR, because an SBOM listing nothing is the shape this repo refuses:
      # a generated artifact that looks complete and describes an empty room.
      - name: Refuse an empty SBOM
        run: |
          components=$(python3 -c "import json;print(len(json.load(open('sbom.cdx.json')).get('components',[])))")
          echo "components: $components"
          if [ "$components" -lt 10 ]; then
            echo "::error::SBOM lists only $components component(s); this project"
            echo "::error::has more direct dependencies than that, so the generator"
            echo "::error::did not see the environment. An SBOM that lists nothing"
            echo "::error::is not a passing SBOM."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  # GATING since 2026-08-20, and a required status check: fail when src/platterpus
  # changes with no change under tests/, mirroring the changelog gate's range
  # logic. Two ways through, both stated in the step below: a release commit whose
  # only src change is the `__version__` line, or a `[no-test-needed] <reason>`
  # line in a commit message of the range, with a real reason (a bare marker is
  # refused). Plenty of legitimate src edits (a comment, a rename, a docstring)
  # need no new test; they take the second door, where review can see why.
  # (This comment called the job "Advisory (never fails)" until the 2026-10-27
  # review, item 2.16: the prose stayed behind when the `exit 1` below landed.)
  tests-touched:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
      # HR-2 §8b: fetch only what this job reads, by explicit refspec. Depth 1 and
      # blobless above, then the full history of HEAD and of main, still without
      # file contents: a range diff fetches the blobs it reads on demand. All
      # branches are NOT fetched, so the `evidence` branch never comes along.
      - name: Fetch HEAD's and main's history, blobless, by refspec (HR-2 §8b)
        run: |
          set -euo pipefail
          deepen=()
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then deepen=(--unshallow); fi
          git fetch --no-tags "${deepen[@]}" --filter=blob:none origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"
      - name: Require a test change, or a stated reason
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"
          fi
          if [ "$EVENT" = "workflow_dispatch" ] || printf '%s' "$base" | grep -qE '^0+$'; then
            echo "No change range to check."; exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          src=$(printf '%s\n' "$changed" | grep -E '^src/platterpus/.*\.py$' || true)
          tst=$(printf '%s\n' "$changed" | grep -E '^tests/.*\.py$' || true)

          if [ -z "$src" ] || [ -n "$tst" ]; then
            echo "src/tests change balance OK. ✅"
            exit 0
          fi

          # ---- src/ changed with no tests/ change. Two legitimate cases, then a refusal.
          #
          # THIS JOB USED TO ONLY WARN, and CLAUDE.md filed it under "Advisory:
          # warns (never fails)". An enforcement audit (2026-08-20) measured the
          # consequence: "every shipped bug gets a regression test in the same
          # change" is the most-cited rule in the repo and had the WEAKEST
          # enforcement of any examined — a GitHub annotation with no `exit 1` on
          # any path. A warning in a log nobody reads is the same as nothing.
          #
          # It is gating now, and escapable BY SAYING WHY rather than by silence —
          # the allowlist-with-a-written-reason pattern used throughout this repo.
          # That is what keeps it from being a false-failure machine: an author who
          # genuinely needs no test always has the door, and has to name the reason
          # in the commit, where review can see it.

          # CASE 1 — a release commit. The version bump touches `__init__.py` and
          # nothing else in src/, and no test should change for it. Recognised
          # precisely (only that file, and only the `__version__` line) rather than
          # by exempting `__init__.py` wholesale, which would let real code through.
          only_init=$(printf '%s\n' "$src" | grep -vE '^src/platterpus/__init__\.py$' || true)
          if [ -z "$only_init" ]; then
            if ! init_diff=$(git diff -U0 "$base" "$head" -- src/platterpus/__init__.py); then
              echo "::error::could not diff __init__.py, so this gate cannot tell a version bump from a code change. Refusing rather than assuming."
              exit 1
            fi
            # Every added/removed line must be the version assignment.
            substantive=$(printf '%s\n' "$init_diff" \
              | grep -E '^[+-]' \
              | grep -vE '^(\+\+\+|---)' \
              | grep -vE '^[+-]__version__' || true)
            if [ -z "$substantive" ]; then
              echo "Version-bump-only change to __init__.py — no test expected. ✅"
              exit 0
            fi
          fi

          # CASE 2 — the author said why. Read the range's commit messages.
          if ! messages=$(git log --format=%B "$base..$head"); then
            echo "::error::could not read the range's commit messages, so this gate cannot find a justification. Refusing rather than passing."
            exit 1
          fi
          reason=$(printf '%s\n' "$messages" | grep -E '^\[no-test-needed\][[:space:]]*.+' || true)
          if [ -n "$reason" ]; then
            # Require a REASON, not just the marker — a bare tag is a blank cheque.
            text=$(printf '%s\n' "$reason" | sed -E 's/^\[no-test-needed\][[:space:]]*//' | head -1)
            if [ "${#text}" -lt 20 ]; then
              echo "::error::[no-test-needed] was given with no real reason (${#text} chars: '${text}'). Say what makes a test unnecessary or impossible here."
              exit 1
            fi
            echo "::warning::src/ changed with no test, justified: ${text}"
            echo "Justified. ✅"
            exit 0
          fi

          echo "::error::src/platterpus changed with NO change under tests/, and no justification given."
          printf '%s\n' "$src" | sed 's/^/    /'
          echo ""
          echo "CLAUDE.md, institutional and non-negotiable: every shipped bug gets a"
          echo "regression test in the same change, and it must fail before the fix."
          echo "Prove it with:  python3 scripts/revert_probe.py <spec.json>"
          echo ""
          echo "If a test genuinely is not the right answer here, add a line to a"
          echo "commit message in this range saying so, with the reason:"
          echo ""
          echo "    [no-test-needed] <why a test cannot or should not cover this>"
          exit 1

  # COMMIT SUBJECTS follow this repository's grammar (the 2026-10-27 review,
  # item 2.9): lowercase `type(scope): summary` or `type: summary`, the grammar
  # CLAUDE.md → Commit & PR hygiene records as a deliberate divergence from the
  # generic SOP, plus the merge, revert and Dependabot subjects git and GitHub
  # write. What it accepts, and why, is `scripts/check_commit_subjects.py`'s
  # docstring; `tests/test_check_commit_subjects.py` holds it against the 400
  # commits up to 27755380, merges included.
  #
  # NOT a required status check: the default-branch ruleset names the required
  # ones, and adding this job to it is the owner's decision (PLANNING.md KDD-43).
  commit-subjects:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
      # HR-2 §8b: fetch only what this job reads, by explicit refspec. Subjects
      # need commits, never file contents, so blobless is all of it.
      - name: Fetch HEAD's and main's history, blobless, by refspec (HR-2 §8b)
        run: |
          set -euo pipefail
          deepen=()
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then deepen=(--unshallow); fi
          git fetch --no-tags "${deepen[@]}" --filter=blob:none origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --is-shallow-repository)" = "false"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check every new commit's subject
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$GITHUB_SHA"
          fi
          if [ "$EVENT" = "workflow_dispatch" ] || printf '%s' "$base" | grep -qE '^0+$'; then
            echo "No change range to check."; exit 0
          fi
          python3 scripts/check_commit_subjects.py --range "$base..$head"

  # The workflows and the shell scripts get linters of their own (the
  # 2026-10-27 review, items 2.5 and 3.6, added on the owner's word that day).
  # NOT required checks yet: the owner adds `workflow-lint` and `shellcheck` to
  # the default-branch ruleset when they choose to. Their pins live in
  # pyproject's `ci-lint` extra (Critical rule #11); zizmor and ShellCheck are
  # installed from build/locks/ci-lint.lock, resolved from it, and actionlint-py,
  # which has no wheel to lock, by the extra's range.
  workflow-lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # zizmor and ShellCheck from build/locks/ci-lint.lock, exact and hashed
      # (the follow-up review of 2026-10-27, item 5). actionlint-py cannot be in
      # that lock: it publishes only an sdist, whose build downloads the
      # actionlint binary from GitHub (and checks it against the checksums the
      # sdist carries), so it is still installed by pyproject's minor range.
      # TASKS R91 records that gap.
      - name: Install zizmor and ShellCheck (hashed lock), and actionlint (pyproject's range)
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: -r build/locks/ci-lint.lock
          spec="$(python -c '
          import pathlib, tomllib
          extra = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"][
              "optional-dependencies"
          ]["ci-lint"]
          print(next(s for s in extra if s.startswith("actionlint-py")))
          ')"
          echo "pyproject pin: $spec"
          python -m pip install "$spec"
      # actionlint checks every file under .github/workflows, and runs the pinned
      # ShellCheck over each `run:` block (installed here so the result does not
      # depend on what the runner image happens to carry); zizmor runs
      # offline over all of .github (the workflows and dependabot.yml), so it
      # judges the files as written and never calls GitHub's API.
      # Findings a reviewer accepted carry a `# zizmor: ignore[...]` beside them.
      - name: actionlint
        run: actionlint -color
      - name: zizmor (offline)
        run: zizmor --offline --format plain .github

  shellcheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # ShellCheck (and zizmor, which this job does not run) from the hashed
      # lock build/lock-requirements.sh resolves from pyproject's `ci-lint` extra.
      - name: Install ShellCheck from the hashed ci-lint lock
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r build/locks/ci-lint.lock
      # Every tracked shell script, read NUL-separated so no name can split. The
      # handshake folder is left out on purpose: its rig scripts are sent records,
      # kept byte for byte as the peer received them. The list is held to every
      # file with a shell shebang by tests/test_ci_lint_jobs.py, so a new script
      # can't fall outside it.
      - name: ShellCheck every shell script
        run: |
          set -euo pipefail
          mapfile -d '' -t scripts < <(git ls-files -z -- '*.sh' .githooks/pre-commit ':(exclude)docs/handshake/**')
          echo "checking ${#scripts[@]} scripts"
          test "${#scripts[@]}" -ge 10
          shellcheck "${scripts[@]}"

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Test across the Python versions our users actually run. We've been
        # bitten by version-specific breakage before (the previous ripper's
        # pkg_resources use vs Python 3.14); a matrix catches the GUI side of that class of
        # problem early. 3.11 is the floor (pyproject `requires-python`); 3.14
        # (2025-10) was added 2026-07-02 (nothing the project uses was removed
        # in it; PySide6 6.11 supports it).
        #
        # NOT 3.15, though it shipped 2026-10-09 and setup-python offers 3.15.2
        # (the 2026-10-27 review, item 2.10, checked that day). Every PySide6
        # 6.11.x declares `Requires-Python >=3.10,<3.15`, so on 3.15 pip finds
        # only PySide6 6.12.0, which our minor pin (`>=6.11.1,<6.12`, Critical
        # rule #11, held equal to the AppImage recipe) refuses: `pip install -e
        # ".[dev]"` fails before a test runs. Measured with CPython 3.15.2 from
        # actions/python-versions. A 3.15 leg arrives with the deliberate
        # PySide6 6.12 bump, not before it.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # The coverage gate runs on ONE leg (maintainer, 2026-09-26). Every leg
        # still runs every test. py3.14 measures branch coverage with
        # `sys.monitoring`, and 3.11-3.13 pay for it with the slower C tracer,
        # which is most of why their legs took 590-640 s against 3.14's 394 s.
        # The floor is still enforced on every push and PR, on this leg.
        include:
          - python-version: "3.14"
            coverage: true
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Depth 1 here, then history + tags by refspec in the next step.
          fetch-depth: 1

      # Full history + tags. TWO tests depend on this, and both SKIP rather than
      # fail without it -- so a shallow clone would silently remove them:
      #   * tests/test_doc_version_stamps.py diffs docs against the latest
      #     release tag;
      #   * tests/test_check_script.py::test_the_coverage_floor_never_ratchets_down
      #     reads the coverage floor AT that tag, because a committed high-water
      #     constant is not a ratchet (whoever lowers the floor edits it in the
      #     same commit); the tagged value is the only one that cannot be
      #     rewritten.
      # And `scripts/handshake.py::our_pin()` pickaxes the version literal to find
      # the commit a release was cut at; in a depth-1 clone it sees nothing, which
      # is how a green branch run turned red the moment the same tests ran against
      # main (2026-08-26, measured by reproducing the shallow clone locally).
      # By refspec (HR-2 §8b): HEAD's and main's whole history and the `v*`
      # release tags, never every branch, so the `evidence` branch stays out.
      # Not blobless: the suite pickaxes history (`handshake.py::our_pin`), and a
      # blob fetched on demand per commit would be slower than fetching them all.
      - name: Fetch HEAD's and main's history and the release tags (HR-2 §8b)
        run: |
          set -euo pipefail
          deepen=()
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then deepen=(--unshallow); fi
          git fetch --no-tags "${deepen[@]}" origin '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/v*:refs/tags/v*'
          test "$(git rev-parse --is-shallow-repository)" = "false"
          echo "release tags fetched: $(git tag --list 'v*' | wc -l)"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6 imports a handful of system libraries even under the
      # "offscreen" Qt platform (no display needed). Install the minimal set;
      # without these the QApplication fixture in conftest.py fails to load.
      #
      # And ONE NAMED FONT, `fonts-dejavu-core` (the 2026-10-27 review, item
      # 3.1). The accessibility conformance gate measures clipped text and
      # cut-off cells with real font metrics, so its verdict depended on
      # whatever sans-serif the runner image happened to supply: with Inter as
      # the default, 3 conformance tests fail; with DejaVu Sans all pass. The
      # test fixture selects "DejaVu Sans" by name and fails loudly when Qt
      # cannot find it, so this package is what makes the gate repeatable.
      #
      # BOUNDED AND RETRIED, because this is the step that wedges. It stalled on
      # the GitHub runner four times across three runs of one branch, past 20
      # minutes each, with no bound at all — apt's own defaults let a mirror that
      # accepts the connection and then trickles hold a fetch open far longer than
      # the whole step is worth, and `apt-get` has no overall deadline of its own.
      #
      # Three things, each doing separate work:
      #   * `timeout` wraps EACH apt call, so a stalled fetch dies in minutes
      #     instead of consuming the job budget. It runs UNDER sudo rather than
      #     over it — `timeout sudo apt-get` signals sudo, which need not pass
      #     the signal on; `sudo timeout apt-get` parents apt directly.
      #   * the retry makes a transient stall self-heal inside the same run,
      #     instead of costing a re-run of the whole matrix.
      #   * `Acquire::*::Timeout` bounds apt internally too, so a stall is
      #     usually reported as a failed fetch (diagnosable) rather than
      #     silently killed from outside (not).
      #
      # WHERE THE NUMBERS COME FROM, because the first version got them wrong.
      # 240s per call was set to 75s while two matrix legs were still in flight,
      # calibrated against the two that had finished — 13s and 32s. The full run
      # measured 13s, 32s, 73s and 103s, ALL SUCCESSES. A 75s per-call bound sits
      # inside the healthy range and would have killed the slow-but-working leg.
      # A bound picked from the half of the sample that cannot disprove it is not
      # a measurement. 240s is >2x the slowest healthy WHOLE step, applied per
      # call, and still an order of magnitude below the 20-minute stalls.
      #
      # Two attempts, not three, and that is arithmetic rather than taste:
      # 2 x 2 calls x 240s + 15s backoff = 975s, so the 18-minute step bound
      # holds with room, and the 30-minute job bound still has ~13 minutes for
      # the ~4.5-minute test step. Three attempts at this timeout would be 24.5
      # minutes and would not fit.
      - name: Install headless Qt system libraries
        timeout-minutes: 18
        run: |
          set -euo pipefail
          # Word splitting here is intended, so an array rather than a string.
          opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20
                -o Acquire::https::Timeout=20)
          for attempt in 1 2; do
            # `if`, not a bare call: `set -e` would abort the loop on the first
            # failed attempt and the retry would never happen.
            echo "::group::apt attempt ${attempt}"
            if sudo timeout -k 10 240 apt-get "${opts[@]}" update \
               && sudo timeout -k 10 240 apt-get "${opts[@]}" install -y \
                    --no-install-recommends \
                    libegl1 libgl1 libglib2.0-0 libxkbcommon0 \
                    libdbus-1-3 libfontconfig1 libfreetype6 \
                    fonts-dejavu-core; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            # Named, because "the apt step failed" is not diagnosable and the
            # attempt number separates a stalled mirror from a broken package
            # list: a stall fails both attempts the same way, a real error fails
            # attempt 1 instantly.
            echo "::warning::apt attempt ${attempt} failed or timed out"
            # No sleep after the last attempt — it would only delay the failure.
            [ "${attempt}" -eq 2 ] || sleep 15
          done
          echo "::error::could not install the headless Qt libraries in 2 attempts"
          exit 1

      # ONE hashed lock for every leg, 3.11 to 3.14 (2026-10-27, the review's
      # follow-up to item 2.3). build/locks/ci.lock is a universal resolution of
      # the runtime dependencies, the dev extra and the build backend, with the
      # sha256 of every file each pinned version publishes, so every leg runs the
      # same versions as every other, and as the AppImage lock pins for the
      # runtime (tests/test_dependency_locks.py holds the two equal). `pip install
      # -e ".[dev]"` resolved the newest release in each range on the day, per
      # leg. Then the project: no index, no dependencies, no build isolation, so
      # nothing but the lock reaches PyPI.
      - name: Install package with dev extras
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r build/locks/ci.lock
          python -m pip install --no-index --no-deps --no-build-isolation -e .

      # Run with branch coverage and a hard floor. The gate ratchets up as
      # the suite grows — raise --cov-fail-under when TOTAL comfortably clears
      # it; never lower it to make a red build pass. 91 -> 93 on 2026-10-27 (the
      # external review, item 2.11): main's run 40425541839, this leg, measured
      # TOTAL 93.28%, rounded DOWN to a whole number. `scripts/check.py`'s
      # COVERAGE_FLOOR moves with it (`tests/test_check_script.py`).
      #
      # A single clean pass. The offscreen-Qt/PySide *process abort* that used to
      # flake this matrix (SIGSEGV/SIGABRT) was a wrong-thread QObject destruction
      # in the pending-installs dialog — fixed at the root (see the 2026-07 entry
      # in docs/testing.md), so the retry-on-abort wrapper that masked it is gone.
      # `timeout-minutes` is a cheap backstop: if a future regression hangs the
      # suite, the job fails in minutes instead of burning the 6-hour default.
      # NOTE: no `-q` here. `addopts` in pyproject.toml already passes one, and a
      # second took verbosity to -2, which suppresses pytest's `N passed` summary
      # line. That mattered more than it looks: the summary is the only
      # human-visible proof in the log that the run *reached the end*, so its
      # absence looked normal and hid a run that died at 76% (2026-07-29).
      # `-n auto`: one pytest-xdist worker per CPU (4 on these runners). The
      # session-finish hooks in tests/conftest.py are controller-only under it, so
      # the completion sentinel checked below still speaks for the whole run.
      - name: Run tests (coverage gate on the py3.14 leg)
        env:
          QT_QPA_PLATFORM: offscreen
          # Where tests/conftest.py writes the collected-test count, for the
          # baseline check below. Outside the checkout, so nothing can commit it.
          PLATTERPUS_TEST_COUNT_FILE: ${{ runner.temp }}/pytest-collected-count
        timeout-minutes: 15
        run: >-
          pytest -n auto
          ${{ matrix.coverage && '--cov=platterpus --cov-report=term-missing --cov-fail-under=93' || '' }}

      # The exit code above is NOT sufficient on its own. conftest.py ends the
      # session with `os._exit(status)` (to dodge a PySide teardown abort), so any
      # `os._exit(0)` reached from product code mid-run is indistinguishable from
      # success: status 0, no summary, no coverage report, and `--cov-fail-under`
      # never evaluated. That exact thing happened — a test drove the
      # update-relaunch path into the real `os._exit`, the suite stopped at 76%,
      # and this job went green (2026-07-29).
      #
      # A truncated run cannot detect itself, so the check has to live outside it:
      # `pytest_sessionfinish` writes this file as its very last act, and a run
      # that vanished simply never wrote it.
      - name: Confirm the suite actually finished
        run: |
          if [ ! -f .pytest-session-complete ]; then
            echo "::error::The pytest session never reached session-finish."
            echo "Something ended the process mid-run — most likely product code"
            echo "calling os._exit (see platterpus.hard_exit and the autouse"
            echo "hard_exit_calls fixture in tests/conftest.py). The exit status"
            echo "of the step above is meaningless: results were never tallied and"
            echo "the coverage gate never ran."
            exit 1
          fi
          echo "Session completed; recorded exit status: $(cat .pytest-session-complete)"

      # A FINISHED run is not a COMPLETE one (the 2026-10-27 review, item 2.12).
      # The step above proves the session reached its end; this one proves it
      # collected at least as many tests as `tests/collected-tests-baseline.txt`
      # records. A module that silently stops being collected leaves a finished,
      # green run with less in it, and only a count can see that. It ratchets:
      # the script prints a notice with the number to raise the baseline to when
      # a change adds tests, and `tests/test_check_test_count.py` refuses a
      # baseline below the newest release tag's. One baseline for every leg:
      # main's run 40425541839 collected 9,313 on py3.11 and on py3.12 alike
      # (9,292 passed + 21 skipped each), so a leg below it has lost tests.
      - name: Refuse a run that collected fewer tests than the baseline
        env:
          PLATTERPUS_TEST_COUNT_FILE: ${{ runner.temp }}/pytest-collected-count
        run: python3 scripts/check_test_count.py --count-file "$PLATTERPUS_TEST_COUNT_FILE"
