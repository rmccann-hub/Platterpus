name: AppImage

# Build (and smoke-test) the AppImage on every push to main, so a broken build
# recipe is caught immediately — not only when a release is tagged. The same
# recipe (build/build_appimage.sh) is used here, in release.yml, and locally,
# so there is exactly one build to maintain.
#
# Also runnable on demand (workflow_dispatch) on ANY branch: that uploads a
# downloadable AppImage artifact, which is how you test a feature branch that
# doesn't have a published release yet. Procedure: docs/architecture.md §6.1
# (it absorbed the former `appimage-testing.md` on 2026-08-06).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow builds, smoke-tests and uploads an artifact, and
# none of that writes to the repository (artifact upload uses the runner's own
# token). Without this block it ran with the repository's default token.
permissions:
  contents: read

jobs:
  build:
    # Match release.yml: an older glibc keeps the bundled manylinux CPython
    # broadly compatible across the target distros.
    runs-on: ubuntu-22.04
    # Bounded like every other job in the repo — see
    # tests/test_ci_jobs_are_bounded.py for why this is swept rather than
    # applied where a hang was last seen. Generous because this one downloads a
    # manylinux CPython and builds an AppImage around it.
    timeout-minutes: 45
    steps:
      # The token stays out of .git/config (the 2026-10-27 review, item 1.4):
      # this job builds and uploads an artifact, and never uses git with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # The same hashed lock release.yml installs, so this build proves the
      # release's own toolchain on every push to main (and on any branch it is
      # dispatched for). Exact versions with the sha256 of every file, refused
      # otherwise; resolved from pyproject's ranges by build/lock-requirements.sh
      # and held inside them by tests/test_dependency_locks.py.
      - name: Install build tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r build/locks/release.lock

      - name: Build the AppImage
        env:
          # FUSE isn't available on GitHub runners; build/appimagetool honour
          # this and extract-and-run instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Authenticated API access avoids 403s on python-appimage's CPython
          # base-image download.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build/build_appimage.sh

      - name: Smoke-test the built AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x platterpus-x86_64.AppImage
          ./platterpus-x86_64.AppImage --version

      # The updater imports sigstore lazily, so an AppImage built without a working
      # copy passes --version and then refuses every update it is ever offered,
      # stranding its users. Run the BUNDLED Python on a genuine attestation.
      - name: Check the bundled attestation verifier works
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          work="$(mktemp -d)"
          (cd "$work" && "$GITHUB_WORKSPACE/platterpus-x86_64.AppImage" --appimage-extract >/dev/null)
          # The first match of the glob, as `ls | head -1` gave it, without
          # parsing ls (ShellCheck SC2012, via actionlint).
          py=""
          for candidate in "$work"/squashfs-root/opt/python*/bin/python3*; do
            if [ -f "$candidate" ]; then py="$candidate"; break; fi
          done
          test -n "$py"
          echo "bundled interpreter: $py"
          PYTHONNOUSERSITE=1 "$py" scripts/check_bundled_verifier.py --bundle-root "$work/squashfs-root"

      - name: Upload the AppImage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platterpus-x86_64.AppImage
          path: platterpus-x86_64.AppImage
          if-no-files-found: error
