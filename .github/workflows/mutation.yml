name: Mutation testing (weekly)

# Test-EFFICACY signal. Coverage says which lines RAN; mutation testing says
# whether the tests would actually CATCH a bug. Scheduled + manual only: it never
# runs on a PR and never gates a merge (docs/testing.md calls it a periodic
# audit, not a CI gate).
#
# ---------------------------------------------------------------------------
# WHY THIS NO LONGER USES `mutmut`, AND WHY THE OLD DIAGNOSIS WAS WRONG
# ---------------------------------------------------------------------------
# History, because both halves matter:
#
#   1. This job spent SEVEN runs reporting success while measuring nothing. An
#      unpinned mutmut major release removed `--paths-to-mutate`, `|| true` hid
#      the exit code, and a hard failure and a completed audit produced the same
#      green tick. Found 2026-08-28 by reading run DURATIONS, not conclusions.
#
#   2. It was then pinned, given a floor, and left deliberately RED with a
#      recorded diagnosis: mutmut could not match its trampoline keys because
#      `pythonpath = ["src"]` and an editable install give two competing sys.path
#      stories.
#
# **That second diagnosis is wrong, and measuring it is what showed so**
# (2026-09-05). Under `pytest` run from `mutants/`, the mutated module IS the one
# imported -- `platterpus.ctdb.crc` resolves to
# `mutants/src/platterpus/ctdb/crc.py` with the trampoline present. And
# `mutmut run` executes NOTHING even when a single mutant is named on the command
# line: 150 ms, "0 files mutated, 156 ignored, 1 unmodified", exit 0.
#
# So a previous session EXPLAINED the symptom without reproducing it, which is
# the first question CLAUDE.md asks of any fix, and the explanation was
# plausible, specific and not the mechanism. The record is corrected here rather
# than quietly dropped, because a wrong diagnosis left in a comment is worse than
# none: the next reader stops looking.
#
# **The replacement is ours: `scripts/mutation_sweep.py`.** Not another
# third-party mutator, because Critical rule #11 -- *a tool that gates CI must
# not float* -- was written after exactly this failure, and swapping one external
# mutator for another keeps the mode: a signal that can retire under us without
# saying so. The sweep is built on the primitive this repo already trusts
# (`scripts/revert_probe.py`: apply an edit, run named tests, see if they
# noticed), has no dependency beyond pytest, and cannot have its CLI removed by
# somebody else's release.
#
# It carries the same floor for the same reason: a sweep that CHECKED nothing
# must not read as a clean one.

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-22.04
    timeout-minutes: 90  # hard bound -- this is a signal, not a blocker
    strategy:
      fail-fast: false
      matrix:
        include:
          # One leg per trust-bearing module, with the tests that exercise it.
          # Split so a slow module cannot starve the others of the time budget,
          # and so a survivor is attributable without re-running everything.
          - name: verdict
            target: src/platterpus/verdict.py
            tests: tests/test_verdict.py
          - name: ctdb-crc
            target: src/platterpus/ctdb/crc.py
            tests: tests/test_ctdb_verify.py tests/test_ctdb_calibrate.py
          - name: cyanrip-log
            target: src/platterpus/parsers/cyanrip_log.py
            tests: tests/test_parsers_cyanrip_log.py
          - name: rip-log
            target: src/platterpus/parsers/rip_log.py
            tests: tests/test_parsers_rip_log.py
          - name: eac-log
            target: src/platterpus/parsers/eac_log.py
            tests: tests/test_parsers_eac_log.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # The suite drives PySide6, so the headless Qt system libs are needed.
      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 \
            libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # No `|| true`. A crash is a red leg, and the floor inside the script tells
      # a crashed run apart from one that measured nothing -- which is the whole
      # distinction the mutmut era could not make.
      - name: Sweep ${{ matrix.name }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # `set -o pipefail` because the `| tee` below would otherwise report
          # TEE's exit code, so a sweep that failed its floor would look green.
          # That is the exact defect `CLAUDE.md` records four times and the one
          # this whole workflow exists to have stopped making -- introducing it
          # here, in the job about signals that lie, would have been the joke.
          set -o pipefail
          python3 scripts/mutation_sweep.py \
            --target "${{ matrix.target }}" \
            $(for t in ${{ matrix.tests }}; do printf -- "--tests %s " "$t"; done) \
            --limit 40 --min-checked 8 \
            --json "mutation-${{ matrix.name }}.json" \
            | tee "mutation-${{ matrix.name }}.log"

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Mutation sweep — ${{ matrix.name }}"
            echo
            echo '```'
            cat "mutation-${{ matrix.name }}.log" 2>/dev/null || echo "(no log — the sweep did not get that far)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded on failure too: the log IS the diagnosis when a sweep measured
      # nothing, and a red job without evidence just moves the mystery.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.name }}
          path: |
            mutation-${{ matrix.name }}.json
            mutation-${{ matrix.name }}.log
          if-no-files-found: warn
