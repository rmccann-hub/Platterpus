name: Release

# Push a version tag (e.g. `git tag v0.0.2 && git push origin v0.0.2`) and this
# builds the AppImage in a clean environment and attaches it to a GitHub
# Release automatically. No more hand-building or manual uploads — cutting a
# release is one `git tag`.
#
# The build itself reuses build/build_appimage.sh (the same script developers
# run locally), so there is exactly one build recipe to maintain.

on:
  push:
    tags:
      - "v*"
  # Manual trigger that CREATES the tag itself (via `gh release create
  # --target`). Exists because tag pushes aren't possible from every
  # environment (the cloud session's git proxy 403s tag refs) — this lets a
  # release be cut by dispatching the workflow on main with the tag name.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.2.4)"
        required: true

# Needed for the `gh release` calls to create/update the release, for
# `gh workflow run` to dispatch the PyPI publish workflow, and for the
# build-provenance attestation (OIDC identity + writing the attestation).
permissions:
  contents: write # create the GitHub Release + upload assets
  actions: write # dispatch publish-pypi.yml (gh workflow run)
  id-token: write # OIDC identity for build-provenance attestation (Sigstore)
  attestations: write # write the provenance attestation to the repo's store

jobs:
  build-and-release:
    # Pin to 22.04 for a stable, older glibc — the AppImage bundles a
    # manylinux2014 CPython, so building on an older host keeps it broadly
    # compatible across the target distros (Bazzite, Fedora, Arch, Ubuntu).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # THE HANDSHAKE GATE (CLAUDE.md critical rule #12 /
      # docs/cyanrip-handshake.md §7). Platterpus and the cyanrip fork are each
      # other's dependency, and neither releases while a round is open — both
      # directions must be verified first, because a partly-verified pin is an
      # unverified pin.
      #
      # This step exists because the rule was written in three documents and
      # enforced on the release path in none of them: the only check was a unit
      # test asserting every round was closed, which blocked ordinary commits
      # (a round is *supposed* to be open between sending and verifying) and
      # never ran here, where releases actually happen. First, and before the
      # build, so a blocked release costs seconds rather than a full AppImage.
      - name: Handshake gate — refuse to release with an open round
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # A PRE-RELEASE is permitted while a handshake round is open; a STABLE
        # release is not. The fork named the deadlock this resolves (round 7 lap 6
        # §1): a round cannot close without hardware evidence, that evidence needs
        # the reviewed build installed, and installing it is forbidden while the
        # round is open. Refusing the beta does not protect a user — it guarantees
        # the round can never close. The gate still prints every open round, so a
        # pre-release never looks like a clean record.
        run: |
          case "$TAG" in
            v0.*|*-*|*a[0-9]*|*b[0-9]*|*rc[0-9]*)
              python scripts/handshake.py --release-gate --prerelease ;;
            *)
              python scripts/handshake.py --release-gate ;;
          esac

      # THE CI GATE. Nothing required CI to have passed before a release — found by
      # the 2026-08-18 enforcement audit. `release.yml` runs on a tag push or a
      # workflow_dispatch, and a `needs:` only orders jobs WITHIN one workflow, so the
      # `test`/`lint`/`typecheck` matrix in `ci.yml` had no relationship to this at all.
      # A release could therefore ship a commit whose suite was red, or whose suite had
      # never run — and the release artifacts are what users auto-update to.
      #
      # Checked by asking GitHub for the commit's own check runs rather than by trusting
      # ordering. Two failure modes are distinguished, because they need different
      # responses and conflating them is how a gate becomes advisory:
      #   * a required check FAILED    -> refuse, always.
      #   * a required check is ABSENT -> refuse, unless CI has not been given time to
      #     start, in which case say so rather than passing silently. "No result" is not
      #     a pass; that is this project's tri-state rule applied to a gate.
      - name: CI gate — refuse to release a commit whose CI is not green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The contexts that must be green. Named explicitly rather than "all of them":
          # `tests-touched` is advisory BY DESIGN and must never block a release, and a
          # future advisory job must not silently acquire veto power over one.
          #
          # Newline-delimited and read with `while read`, because a check name contains
          # a space ("test (py3.11)") and word-splitting would shred it. This is the
          # boring way on purpose — the first draft split on a sed-inserted delimiter,
          # which is the kind of cleverness that breaks the day somebody renames a job.
          required=$(cat <<'NAMES'
          test (py3.11)
          test (py3.12)
          test (py3.13)
          test (py3.14)
          lint
          typecheck
          changelog
          media-guard
          pip-audit
          NAMES
          )
          echo "Commit under release: $SHA"
          runs="$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                    --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion // "-")"')"
          if [ -z "$runs" ]; then
            echo "::error::No check runs at all for $SHA. CI has not run on this commit, so there is no evidence its suite passes. Push the commit to a branch, let CI finish, then tag."
            exit 1
          fi
          printf '%s\n' "$runs" | sed 's/^/  /'

          missing=""; failed=""; pending=""
          while IFS= read -r name; do
            name="$(printf '%s' "$name" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -n "$name" ] || continue
            line="$(printf '%s\n' "$runs" | awk -F'\t' -v n="$name" '$1 == n { print; exit }')"
            if [ -z "$line" ]; then
              missing="$missing
            $name"
              continue
            fi
            status="$(printf '%s' "$line" | cut -f2)"
            conclusion="$(printf '%s' "$line" | cut -f3)"
            if [ "$status" != "completed" ]; then
              pending="$pending
            $name ($status)"
            elif [ "$conclusion" != "success" ]; then
              failed="$failed
            $name ($conclusion)"
            fi
          done <<<"$required"

          rc=0
          if [ -n "$failed" ]; then
            echo "::error::Required CI check(s) did not pass on $SHA:$failed"
            echo "A release must not ship a commit whose suite is red."
            rc=1
          fi
          if [ -n "$pending" ]; then
            echo "::error::Required CI check(s) have not finished on $SHA:$pending"
            echo "Wait for CI, then re-run this release — an unfinished check is not a pass."
            rc=1
          fi
          if [ -n "$missing" ]; then
            echo "::error::Required CI check(s) never ran on $SHA:$missing"
            echo "Absence of a result is not a pass (CLAUDE.md: tri-state, never a bare negative)."
            rc=1
          fi
          if [ "$rc" = "0" ]; then
            echo "All required CI checks are green on $SHA. ✅"
          fi
          exit "$rc"

      - name: Changelog gate — refuse to tag with a non-empty [Unreleased]
        # v0.6.12 shipped with six entries still under `[Unreleased]`, describing
        # work that IS in that tag. Nothing caught it: the version-bump gate
        # (tests/test_no_stale_version_claims.py) asserts that a `## [X.Y.Z]`
        # section exists, that it has a compare link, and that the `[Unreleased]`
        # link points at it — and ALL THREE PASS with a fully populated
        # `[Unreleased]`. Three green assertions about the right release, none of
        # them about the thing that was wrong.
        #
        # It lives HERE rather than in the suite because "were the entries moved"
        # is a property of the TAG, not of somebody's working tree: between
        # releases a populated `[Unreleased]` is correct and a test asserting
        # otherwise would be red for most of the project's life.
        #
        # BOTH HALVES, because "moved" is a claim about two places and the first
        # version of this gate only looked at one. It checked that `[Unreleased]`
        # was empty and then printed *"entries were moved"* — so **deleting** the
        # entries passed identically to moving them, and the success line asserted
        # the one thing it had not checked. That is the very defect it was written
        # to fix, displaced by one step (found by an enforcement audit, 2026-08-18:
        # *can this check be satisfied by finding nothing?*). An empty
        # `[Unreleased]` over an empty `## [X.Y.Z]` is a release whose changelog
        # says nothing happened, which is worse than one that says it is unreleased.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

          m = re.search(r"^## \[Unreleased\][^\n]*\n(.*?)(?=^## \[)", text,
                        re.M | re.S)
          if m is None:
              sys.exit("CHANGELOG.md has no [Unreleased] section followed by a "
                       "released one — the format changed; fix this gate.")
          body = [l for l in m.group(1).splitlines() if l.strip()]
          if body:
              print(f"::error::CHANGELOG.md still has {len(body)} line(s) under "
                    "[Unreleased]. Move them under the new '## [X.Y.Z] — <date>' "
                    "heading before tagging — otherwise this release ships a "
                    "changelog that calls its own contents unreleased.")
              for line in body[:20]:
                  print(f"  {line}")
              sys.exit(1)

          # THE DESTINATION. Keyed on $TAG, not on `__version__`: this gate is about
          # what THIS tag ships, and a version constant read out of the tree is a
          # different question that the suite already asks.
          landed = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.M | re.S,
          )
          if landed is None:
              sys.exit(f"::error::CHANGELOG.md has no '## [{version}]' section, so "
                       f"the entries for tag {tag} went nowhere. An empty "
                       f"[Unreleased] is not evidence they were moved — deleting "
                       f"them looks identical from here.")
          moved = [l for l in landed.group(1).splitlines() if l.strip()]
          if not moved:
              sys.exit(f"::error::CHANGELOG.md's '## [{version}]' section is EMPTY. "
                       f"[Unreleased] is empty too, so this release would ship a "
                       f"changelog claiming nothing changed.")
          print(f"changelog gate: [Unreleased] is empty and '## [{version}]' "
                f"carries {len(moved)} line(s) — the entries were moved.")
          PY

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install "build>=1,<2" "python-appimage>=1.4,<2"
          # zsyncmake lets the build emit the .zsync delta-update file next
          # to the AppImage (KDD-17b self-update).
          sudo apt-get update -q && sudo apt-get install -y -q zsync

      - name: Build the AppImage
        env:
          # FUSE isn't available on GitHub runners; the build/appimagetool both
          # honour this and extract-and-run instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Authenticated GitHub API access raises the rate limit for
          # python-appimage's CPython base-image download (anonymous requests
          # get 403'd under load).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build/build_appimage.sh

      # Fail HERE, with a clear message, if the self-update artifacts are
      # missing — not later inside `gh release upload` (the v0.2.0 lesson:
      # a skipped embed surfaced only as a cryptic upload error, and the
      # release ended up with no assets at all).
      - name: Verify update artifacts
        run: |
          if [ ! -f platterpus-x86_64.AppImage.zsync ]; then
            echo "::error::.zsync missing — the update-information embed was skipped."
            echo "Check the build step's '[4/4] Embedding zsync update-information' output."
            exit 1
          fi

      - name: Generate checksum
        run: sha256sum platterpus-x86_64.AppImage > platterpus-x86_64.AppImage.sha256

      - name: Sanity-check the built AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          chmod +x platterpus-x86_64.AppImage
          out="$(./platterpus-x86_64.AppImage --version)"
          echo "$out"
          # Fail loudly if the built version doesn't match the release tag — a
          # forgotten __version__ bump would otherwise ship a mislabeled binary
          # (e.g. a v0.4.9 release containing 0.4.8), breaking the in-app updater's
          # version compare. TAG is like "v0.4.9"; --version prints
          # "platterpus 0.4.9 (abc1234)".
          #
          # EXACT, not a substring. This was `case "$out" in *"$expected"*)`, which
          # catches the direction the comment names and not the other one: `v0.6.1`
          # is a substring of `platterpus 0.6.14`, so a dropped digit in the
          # dispatch input would ship a 0.6.14 binary under tag v0.6.1 and pass.
          # Measured against a real build: v0.6.14, v0.6.1, v0.6 and v0. all
          # passed. Found by an enforcement audit, 2026-08-18.
          #
          # The version is pulled out as its own whitespace-delimited field and
          # compared with `=`, so neither a prefix nor a suffix can satisfy it.
          expected="${TAG#v}"
          built="$(printf '%s\n' "$out" | head -n 1 | awk '{print $2}')"
          if [ "$built" != "$expected" ]; then
            echo "::error::built version ('$built', from \"$out\") is not tag $TAG"
            exit 1
          fi
          echo "version check: built '$built' == tag '$expected'"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag-push runs use the pushed tag; dispatch runs carry it as input.
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # 0.x (and any tag with a pre-release suffix) ship as pre-releases.
          #
          # **This list must be IDENTICAL to the handshake gate's list above**, and
          # it was not: that one carries `*a[0-9]*|*b[0-9]*|*rc[0-9]*` and this one
          # did not. The two together decide one thing — *is this build allowed to
          # claim it is a verified release?* — and they disagreed on the project's
          # own beta spelling. `v0.6.12b6` was covered only by the `v0.*` prefix, so
          # the gap was invisible for the whole v0.x line and would have opened at
          # v1.0.0: a `v1.0.1b1` tag would take the RELAXED handshake gate (it
          # matches `*b[0-9]*`) and then publish as a STABLE GitHub release (it
          # matched neither pattern here). A build excused from the gate, published
          # as though it had passed it.
          #
          # Found 2026-08-18 by an enforcement audit, before v1.0.0 rather than
          # after. `tests/test_handshake_tooling.py` now diffs the two lists.
          case "$TAG" in
            v0.*|*-*|*a[0-9]*|*b[0-9]*|*rc[0-9]*) PRERELEASE="--prerelease" ;;
            *)                                    PRERELEASE="" ;;
          esac
          # Create the release if it doesn't exist yet; otherwise just (re)upload
          # the assets. --generate-notes auto-summarises merged PRs since the
          # last tag; the canonical detailed notes live in CHANGELOG.md.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              platterpus-x86_64.AppImage platterpus-x86_64.AppImage.sha256 \
              platterpus-x86_64.AppImage.zsync \
              install.sh install-appimage.sh --clobber
            # Ensure it's published, not left a draft. If a PRIOR run created the
            # draft (below) but died before flipping it off, every retry took this
            # branch and re-uploaded assets while the release stayed an invisible
            # draft forever. Idempotent on an already-published release.
            gh release edit "$TAG" --draft=false
          else
            # Create as a DRAFT first. A draft is invisible to the unauthenticated
            # releases-list API the in-app updater polls, so the release can't be
            # seen until EVERY asset is attached — crucially the small .sha256 the
            # updater fetches FIRST. Publishing up-front (the old behaviour) left a
            # window while the 237 MB AppImage uploaded where the release was live
            # but its checksum 404'd: "couldn't fetch the update checksum: HTTP
            # Error 404" (real-user report on v0.4.0). gh uploads all assets as
            # part of `create`, so by the time we flip the draft off they're all
            # present.
            gh release create "$TAG" \
              platterpus-x86_64.AppImage platterpus-x86_64.AppImage.sha256 \
              platterpus-x86_64.AppImage.zsync \
              install.sh install-appimage.sh \
              --title "Platterpus $TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --draft \
              $PRERELEASE
            # Every asset is attached — publish atomically (keeps the prerelease
            # flag set at create time).
            gh release edit "$TAG" --draft=false
          fi

      # Build-provenance attestation (2026-07-08 trust-audit follow-up). Emits a
      # cryptographically signed SLSA provenance statement binding THIS exact
      # AppImage — by its SHA-256 digest — to the workflow, repo, and commit that
      # produced it, using GitHub's OIDC identity and the public Sigstore
      # transparency log. There is NO maintainer-held key and NO new runtime
      # dependency: the trust root is GitHub + Sigstore. A downloader can then
      # prove the binary genuinely came from this repo's release pipeline (not
      # swapped by an attacker or a compromised mirror) with:
      #   gh attestation verify platterpus-x86_64.AppImage --repo rmccann-hub/Platterpus
      # The .sha256 asset proves a download is INTACT (integrity); this proves it
      # is AUTHENTIC (built by us). NOTE: the in-app auto-updater still verifies
      # only the SHA-256 — it does not yet check this attestation (that, plus
      # minisign signing, is the remaining "update authenticity" work in TASKS.md
      # / SECURITY.md). Placed AFTER the release is published so a transient
      # attestation hiccup can never block shipping the binary; the attestation
      # binds to the artifact's digest, so this ordering doesn't affect it.
      - name: Attest AppImage build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: platterpus-x86_64.AppImage

      # Kick off the PyPI publish in its OWN run. We must DISPATCH it rather
      # than rely on a `release: published` trigger: the release above is
      # created with the default GITHUB_TOKEN, and GitHub suppresses the events
      # a GITHUB_TOKEN generates — so that trigger never fires (this is why
      # v0.2.4–v0.2.7 shipped with no PyPI publish). workflow_dispatch is the
      # documented EXCEPTION — it always creates a run, even via GITHUB_TOKEN —
      # so this is the reliable hand-off. Dispatched on the release TAG so the
      # publish builds the released commit. A separate run keeps the rule that a
      # PyPI problem can't block the AppImage release (already created above).
      - name: Trigger the PyPI publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh workflow run publish-pypi.yml --ref "$TAG"
