# Dependabot keeps the two supply-chain surfaces current via reviewed PRs:
#   * pip            — the Python runtime/dev dependencies (pyproject.toml),
#     including the self-declared-unmaintained musicbrainzngs (DEPENDENCIES.md);
#   * github-actions — the CI/release workflow actions, so `uses:` pins are
#     bumped for us as new versions ship (a step toward SHA-pinning).
# Weekly. VERSION updates arrive GROUPED, one pull request per ecosystem per week
# (the 2026-10-27 review, item 2.13): a session carries a bump on its own branch
# with the BOM regenerated and a CHANGELOG bullet (PLANNING.md KDD-43, "How to
# handle it"), so one notice a week costs less than one per package. SECURITY
# updates stay ungrouped (`applies-to: version-updates` below), so each advisory
# arrives as its own pull request.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # A release must be a week old before Dependabot proposes it (zizmor's
    # dependabot-cooldown audit, 2026-10-27): a compromised release is usually
    # caught and pulled within days, so waiting keeps one out of a pull request.
    # Cooldown applies to version updates only; security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # NO `labels:` (the third follow-up review of 2026-10-27, item 4). Naming
    # labels makes Dependabot use exactly those, and neither "dependencies" nor
    # "ci" existed in this repository, so it posted a label error on every pull
    # request (#397, #399). With none named, it applies its default
    # "dependencies" label and creates it if missing.
    # tests/test_dependabot_holds_the_pins.py refuses a `labels:` key.
    # THE TWO TOOLS THAT GATE CI ARE HELD HERE, DELIBERATELY.
    #
    # `CLAUDE.md` Critical rule #11 — *a tool that gates CI must not float* —
    # pins `ruff` and `mypy` to the minor they were measured against, because
    # `ruff format` and `mypy --strict` change what they ACCEPT between minor
    # releases: a routine upstream release turns CI red with zero change to our
    # code, and it reads as a code problem. Bumping one is meant to be a
    # deliberate commit that re-runs the gate.
    #
    # **And there was an automated agent in this repository whose job was to
    # undo that.** Dependabot had no `ignore` here, so it proposes range
    # widenings against the pin as a matter of course — #182 has been open since
    # 2026-09-02 asking to take `ruff` from `<0.16` to `<0.17`, which is the
    # whole 0.16 line the rule exists to keep out. Merging it would have floated
    # the gate with a green review, and nothing in CI would have objected: the
    # rule was written in prose and enforced nowhere that Dependabot reads.
    #
    # Same shape as the rule's own recorded failure — it was stated in
    # `pyproject.toml` while CI's `lint` job installed `ruff>=0.15,<1`, so the
    # pin did not bind where the gate ran. This is that lesson arriving from a
    # third direction: a pin also has to bind against whatever is authorised to
    # CHANGE it.
    #
    # **WHY THE OLD IGNORE NEVER WORKED, AND WHAT REPLACED IT (2026-10-27, the
    # second follow-up review, item 2).** Until today each entry here named
    # `update-types: version-update:semver-*`, and Dependabot still opened #303
    # and #399, both widening mypy. The cause is in Dependabot's own code: an
    # `update-types` ignore works out which versions to skip FROM the
    # dependency's current version, and returns nothing when there is none
    # (dependabot-core@8ef6f0723368:common/lib/dependabot/config/ignore_condition.rb:56-58,
    # via `correct_version_for`, :75-82). A pyproject range like
    # `mypy>=2.3,<2.4`, with no lockfile Dependabot reads, HAS no single
    # current version, so every one of those ignores matched nothing.
    #
    # So the CI tools are now ignored BY NAME, with no `update-types`. That
    # ignores every version update (`ignored_versions` returns ALL_VERSIONS,
    # :43), and still lets a SECURITY update through, because for a security
    # update only an explicit `versions:` list is consulted (:42). A tool's
    # minor moves on a deliberate commit that re-runs the gate (Critical rule
    # #11), and the hashed locks move by the weekly lock refresh, not here.
    # This is the fix PLANNING.md KDD-43 offered; KDD-45 records it.
    # tests/test_dependabot_holds_the_pins.py derives this list from
    # pyproject.toml's extras and refuses an `update-types` key under it.
    ignore:
      - dependency-name: "ruff"
      - dependency-name: "mypy"
      - dependency-name: "pip-audit"
      - dependency-name: "build"
      - dependency-name: "twine"
      - dependency-name: "actionlint-py"
      - dependency-name: "zizmor"
      - dependency-name: "shellcheck-py"
      - dependency-name: "python-appimage"
    # THE RUNTIME PINS GET ONE PULL REQUEST EACH (PySide6, sigstore, numpy).
    # They are pinned to a minor too, so a widening is red by design
    # (tests/test_gating_tools_are_pinned.py), but we want to hear of their
    # releases, so they are not ignored. Kept OUT of the weekly group by
    # `exclude-patterns`, each one matches no group, and Dependabot updates a
    # dependency that matches no group in a pull request of its own: a red
    # widening then holds back only itself. (A single `pinned-minor` group did
    # not do that: #399 put PySide6 and mypy in one pull request.) The ignored
    # tools are excluded too, so nothing pinned can reach the weekly group.
    groups:
      pip-weekly:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "PySide6"
          - "sigstore"
          - "numpy"
          - "ruff"
          - "mypy"
          - "pip-audit"
          - "build"
          - "twine"
          - "actionlint-py"
          - "zizmor"
          - "shellcheck-py"
          - "python-appimage"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A release must be a week old before Dependabot proposes it (zizmor's
    # dependabot-cooldown audit, 2026-10-27): a compromised release is usually
    # caught and pulled within days, so waiting keeps one out of a pull request.
    # Cooldown applies to version updates only; security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-weekly:
        applies-to: version-updates
        patterns:
          - "*"
