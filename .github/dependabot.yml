# Dependabot keeps the two supply-chain surfaces current via reviewed PRs:
#   * pip            — the Python runtime/dev dependencies (pyproject.toml),
#     including the self-declared-unmaintained musicbrainzngs (DEPENDENCIES.md);
#   * github-actions — the CI/release workflow actions, so `uses:` pins are
#     bumped for us as new versions ship (a step toward SHA-pinning).
# Weekly. VERSION updates arrive GROUPED, one pull request per ecosystem per week
# (the 2026-10-27 review, item 2.13): a session carries a bump on its own branch
# with the BOM regenerated and a CHANGELOG bullet (PLANNING.md KDD-43, "How to
# handle it"), so one notice a week costs less than one per package. SECURITY
# updates stay ungrouped (`applies-to: version-updates` below), so each advisory
# arrives as its own pull request.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # THE TWO TOOLS THAT GATE CI ARE HELD HERE, DELIBERATELY.
    #
    # `CLAUDE.md` Critical rule #11 — *a tool that gates CI must not float* —
    # pins `ruff` and `mypy` to the minor they were measured against, because
    # `ruff format` and `mypy --strict` change what they ACCEPT between minor
    # releases: a routine upstream release turns CI red with zero change to our
    # code, and it reads as a code problem. Bumping one is meant to be a
    # deliberate commit that re-runs the gate.
    #
    # **And there was an automated agent in this repository whose job was to
    # undo that.** Dependabot had no `ignore` here, so it proposes range
    # widenings against the pin as a matter of course — #182 has been open since
    # 2026-09-02 asking to take `ruff` from `<0.16` to `<0.17`, which is the
    # whole 0.16 line the rule exists to keep out. Merging it would have floated
    # the gate with a green review, and nothing in CI would have objected: the
    # rule was written in prose and enforced nowhere that Dependabot reads.
    #
    # Same shape as the rule's own recorded failure — it was stated in
    # `pyproject.toml` while CI's `lint` job installed `ruff>=0.15,<1`, so the
    # pin did not bind where the gate ran. This is that lesson arriving from a
    # third direction: a pin also has to bind against whatever is authorised to
    # CHANGE it.
    #
    # **What this ignore does NOT do (corrected 2026-10-27, the review's item
    # 2.14).** It names the `version-update:semver-*` types rather than the
    # package, so that a security advisory could still reach us. It was meant to
    # keep ruff and mypy bumps out, and it did not: Dependabot opened #303 anyway,
    # widening mypy from `<2.4` to `<2.5`, and all four `test` legs went red
    # (PLANNING.md KDD-43, "Dependabot, by design"). What holds the pins today is
    # `tests/test_gating_tools_are_pinned.py`, which refuses a widened range, and
    # the KDD-43 practice of treating such a pull request as a notice. KDD-43
    # offers ignoring the two by name, without `update-types`; the owner has not
    # chosen it, so this block is left as it was.
    ignore:
      - dependency-name: "ruff"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "mypy"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # The CI tools pinned on 2026-10-27 (pip-audit, build, twine and the three
    # linters) are held the same way and for the same reason (the follow-up
    # review of that day, item 3).
      - dependency-name: "pip-audit"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "build"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "twine"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "actionlint-py"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "zizmor"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "shellcheck-py"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # EVERY MINOR-PINNED PACKAGE GETS A GROUP OF ITS OWN, ahead of the weekly
    # one (the follow-up review of 2026-10-27, item 3). A widened minor pin is
    # refused by tests/test_gating_tools_are_pinned.py by design, so if one
    # slips past the ignore above, as #303 did, it would turn the whole weekly
    # group red and hold every other update back. In its own group it reddens
    # only that pull request. Dependabot puts a package in the FIRST group that
    # matches, so this one must stay above `pip-weekly`. The runtime pins
    # (PySide6, sigstore, numpy) are grouped here but not ignored, because we
    # want to hear of their releases. tests/test_dependabot_holds_the_pins.py
    # derives the list from pyproject.toml, so a new minor pin can't be missed.
    groups:
      pinned-minor:
        applies-to: version-updates
        patterns:
          - "PySide6"
          - "sigstore"
          - "numpy"
          - "ruff"
          - "mypy"
          - "pip-audit"
          - "build"
          - "twine"
          - "actionlint-py"
          - "zizmor"
          - "shellcheck-py"
      pip-weekly:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-weekly:
        applies-to: version-updates
        patterns:
          - "*"
