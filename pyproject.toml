[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platterpus"
# Version is single-sourced from `src/platterpus/__init__.py:__version__`
# (see [tool.setuptools.dynamic] below). Do NOT hard-code it here.
dynamic = ["version"]
description = "A secure, EAC-style CD ripper for Linux (FLAC, WAV, WavPack, MP3)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Platterpus contributors" }]
# "whipper"/"cyanrip" are kept as keywords: they're the rip backends Platterpus
# drives, which is what someone searching for a GUI for them would look up.
keywords = ["audio", "cd", "rip", "flac", "wavpack", "mp3", "musicbrainz", "accuraterip", "whipper", "cyanrip", "qt"]
# License: GPL-3.0-only (KDD-10, decided 2026-05-30). Declared as a PEP 639
# SPDX expression (`license` string + `license-files`); this is the standard as
# of setuptools 77+, and the deprecated `License ::` classifier was dropped
# (setuptools now warns on it and will eventually reject it). `LICENSE` is
# bundled into the wheel via `license-files`. Compatible with our deps: PySide6
# is imported under its LGPL-3 option; cyanrip/ctdb-cli are invoked as
# subprocesses (no linking), so their GPL doesn't reach in.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: CD Audio :: CD Ripping",
]
dependencies = [
    # MINOR-PINNED, not `<7`. A range is a claim that every version in it behaves
    # the same for us, and 6.11.2 disproved it: `QKeySequence.StandardKey.Quit` and
    # `.Preferences` stopped resolving, so the Quit and Settings menu items shipped
    # with no keyboard shortcut — a WCAG 2.1.1 regression from somebody else's
    # release, with no change to our code (2026-08-18; `main_window.standard_shortcut`
    # now checks Qt's answer, and the suite is run against both wheels).
    #
    # This is CLAUDE.md Critical rule #11 applied to a RUNTIME dependency, and it is
    # the second instance of the class here — see the `cryptography` note in
    # DEPENDENCIES.md, where a floating ceiling let pip-audit resolve a vulnerable
    # version and reddened CI with no code change either.
    #
    # The bound is the minor, not the patch: 6.11.x patch releases still flow (they
    # carry Qt's security fixes, and 6.11.2 is now handled correctly and proven
    # green), while a MINOR bump becomes a deliberate commit that re-runs the gate.
    # `build/python-appimage/requirements.txt` must express the same range — it is
    # what actually ships — and a test asserts the two agree.
    "PySide6>=6.11.1,<6.12",
    "musicbrainzngs==0.7.1",
    "tomli-w>=1.0,<2",
    # Ed25519 verification of a release's minisign signature (the in-app
    # updater's authenticity gate — src/platterpus/update_signing.py). Floor is
    # 50.0.0: 49.0.0 and earlier carry CVE-2026-69247, and everything below
    # 48.0.1 also carries GHSA-537c-gmf6-5ccf (bundled-OpenSSL). Ed25519 verify
    # is API-stable across majors, and pip-audit — not this ceiling — is the real
    # vulnerability gate, so <51 only guards against a surprise major API break.
    #
    # RAISE THE CEILING WHEN YOU RAISE THE FLOOR. The previous pair was
    # `>=48.0.1,<50`, and when CVE-2026-69247 landed the fix was 50.0.0 — which
    # the ceiling excluded. pip-audit resolves the HIGHEST version a range allows,
    # so it picked the vulnerable 49.0.0 and CI went red with no change to our
    # code. A ceiling that can exclude the only fix is not a safety margin.
    "cryptography>=50.0.0,<51",
]

[project.optional-dependencies]
# A tool that GATES ci must not float. `ruff format` and `mypy --strict` both
# change what they accept between minor releases, so a wide range means a routine
# upstream release can turn CI red with **zero change to our code** — and the
# failure looks like a code problem, not a dependency one. Worse, local and CI
# then resolve different versions and disagree about a green build.
#
# So the two gating tools are pinned to the minor they were measured against, and
# bumping them is a deliberate commit that re-runs the gate. The non-gating tools
# stay loose: a pytest or hypothesis bump cannot silently redefine "correct".
# (Found while auditing why so much had got through the gates, 2026-07-29.)
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",      # coverage measurement + the CI --cov-fail-under gate
    "hypothesis>=6",      # property-based tests (tests/test_parsers_property.py)
    # --- gating: pinned to the measured minor, bump deliberately ---
    "ruff>=0.15.22,<0.16",  # `lint` + `format --check`; 0.16 may reformat
    "mypy>=2.3,<2.4",       # `typecheck`; the strict flag set is version-dependent
]

[project.scripts]
# Console-script entry — used by pipx install and the AppImage's AppRun.
platterpus = "platterpus.__main__:main"

[project.urls]
Repository = "https://github.com/rmccann-hub/Platterpus"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the in-app window icon (the Platterpus logo SVG) inside the package so it
# is present identically from a source checkout, a pipx install, and the AppImage
# (no loose data-file wiring — same reasoning as help_content living in-code).
[tool.setuptools.package-data]
# `rig_session.sh` ships INSIDE the package for the same reason the icon does:
# so `--rig-session` works identically from a source checkout, a pipx install and
# the AppImage. It used to live in `scripts/`, which meant a hardware session
# needed a source clone at the right commit to run the harness — and the rig
# sheet's instruction was literally `bash ~/path/to/Platterpus/scripts/…`, a
# placeholder nobody could paste. One file, two ways to reach it.
platterpus = ["resources/*.svg", "rig_session.sh"]

# Single source of truth for the version: the build reads __version__ from the
# package itself, so `pyproject.toml` never duplicates it. Everything else
# (the `--version` flag, the About dialog, the MusicBrainz user-agent) already
# imports `platterpus.__version__`, and installed-package metadata
# (`importlib.metadata.version`) is generated from this at build time.
[tool.setuptools.dynamic]
version = { attr = "platterpus.__version__" }

# Ruff is the project linter + formatter (added 2026-06-04). `ruff check`
# lints, `ruff format` formats; CI runs both in --check/no-fix mode. Defaults
# (88-col, double quotes) match the existing code, so adoption was low-churn.
[tool.ruff]
target-version = "py311"
src = ["src"]
# Machine-generated data module (a base64 blob) — regenerated by
# scripts/update_drive_offsets.py; don't lint/format it.
extend-exclude = ["src/platterpus/adapters/accuraterip_offsets_data.py"]

[tool.ruff.lint]
# E/W=pycodestyle, F=pyflakes, I=isort (import order), B=flake8-bugbear
# (likely-bug patterns), UP=pyupgrade (modern 3.11+ syntax).
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    # Long lines are largely comments/strings; the formatter wraps code and
    # we don't want it splitting prose or URLs. Keep E501 off.
    "E501",
]

[tool.ruff.lint.flake8-bugbear]
# Qt's model/view override signatures legitimately default index args to a
# fresh QModelIndex() (the documented PySide idiom); treat it as immutable so
# B008 doesn't flag every rowCount/columnCount/data/parent override.
extend-immutable-calls = ["PySide6.QtCore.QModelIndex"]

# Static type-checking (added 2026-07-08). The project mandates type hints on
# every signature; this gate verifies them. It began as a non-strict baseline
# (catch wrong-attribute / bad-return / None-misuse without a big-bang sprint)
# and ratcheted up module-by-module, mirroring the coverage floor. As of
# 2026-07-20 `disallow_untyped_defs` + `disallow_incomplete_defs` are ENFORCED
# across the ENTIRE package — there are no per-module exclusions left. The Qt
# MainWindow "god-object" and its five mixins were the last hold-out (a mixin's
# `self` is the concrete window at runtime but typed as the bare mixin, so
# cross-mixin `self._x` access couldn't resolve); they now share a typing seam,
# `platterpus.ui.main_window_shared.MainWindowShared`, that declares the surface
# the window exposes to its mixins (see that module + docs/architecture.md §3.6).
[tool.mypy]
python_version = "3.11"
files = ["src/platterpus"]
# NOT `ignore_missing_imports = true` globally, deliberately. That flag made the
# type gate able to collapse silently: if PySide6 ever failed to resolve (a Qt
# bump, a stub regression, or mypy installed into an environment that lacks it —
# which is exactly what a `uv`-isolated `mypy` on PATH does), every Qt class
# became `Any`, the whole UI layer went unchecked, and mypy still printed
# "Success". `musicbrainzngs` is the ONLY dependency that genuinely ships no
# stubs, so it gets a targeted override below and a missing PySide6 now hard-
# fails CI instead of quietly disarming it (audit finding, 2026-07-28).
warn_redundant_casts = true
# Strict def-typing across the whole package: an untyped or partially-typed
# function ANYWHERE now fails the gate. Every package already carried full
# annotations by the time it was brought in, so each ratchet step was a config
# tighten, not an annotation sprint (the UI mixins needed the seam module above).
disallow_untyped_defs = true
disallow_incomplete_defs = true
# Zero-cost hardening (each measured at 0 new errors before adoption):
disallow_untyped_calls = true
disallow_untyped_decorators = true  # guards the @Slot seam
disallow_subclassing_any = true  # the tripwire for a vanished PySide6
strict_equality = true
extra_checks = true
warn_unused_ignores = true
warn_return_any = true
# The last two `--strict` flags, both measured at 0 new errors once the one
# implicit re-export in `adapters/rip_backend.py` was made explicit.
no_implicit_reexport = true
check_untyped_defs = true
# The 13th and last strict flag. Enabled globally with a shrinking list of
# per-module opt-outs below, so the gate ratchets instead of needing one enormous
# diff. A typing census (2026-07-29) measured 131 violations, and 107 of them are
# a SINGLE under-modelled data structure: the `.platterpus.json` report shape,
# written by `rip_report` and read back by `rip_compare` with no shared type.
disallow_any_generics = true

# --- warn_unreachable: deliberately OFF, and this is the reasoning -----------
# Measured 2026-07-29 (mypy 2.3.0): enabling it produces 5 errors, and **all five
# are false positives**. It is not left off out of laziness — one of them is a trap.
#
#   * `workers/drive_setup_worker.py` — the mid-run `if self._cancelled:` check.
#     mypy narrows the flag to False from the early-return above it, because mypy
#     reasons single-threaded. But `cancel()` sets that flag FROM ANOTHER THREAD.
#     "Cleaning up" this unreachable code would delete a real cancel checkpoint in
#     front of a ten-minute probe — exactly the Critical-rule-#9 hazard.
#   * `rip_compare.py` ×3 — `if not isinstance(report, dict)` guards. Production
#     never reaches them because `load_report` already narrowed; three tests reach
#     them deliberately with `# type: ignore[arg-type]` to prove the never-raises
#     contract. That is the project's own parser discipline colliding with static
#     reachability, and the tests are right.
#   * `ui/dialogs/centering.py` — a `screen is None` guard mypy thinks is dead
#     because the PySide6 stubs type `primaryScreen()` non-optional. It genuinely
#     returns None headless.
#
# So: do not enable this expecting a cleanup, and do not paper over it with five
# `# type: ignore` comments — the flag is asking a single-threaded question about
# concurrent code and about guards that only tests are meant to reach.

# --- disallow_any_generics ratchet -------------------------------------------
# Modules that still carry bare `dict` / `list` / `Popen`. **Retire one opt-out
# per commit until this list is empty, then delete the whole block.** The count
# beside each is what a 2026-07-29 census measured (mypy 2.3.0 — the version
# matters, `--strict`'s flag set moves between minors), so progress is checkable.
# Started at 14 modules / 131 errors.
#
# Deliberately NOT a blanket `dict[str, object]` widening. Re-measured 2026-07-29:
# applied to `rip_report` + `rip_compare` it leaves **8** residual
# narrowing/invariance errors (an earlier note here said 9 — corrected); applied to
# all 14 modules it leaves **50**. Reading values back out of `dict[str, object]`
# needs narrowing at every site, so the widening trades one error class for another.
# The report wants a real TypedDict, which is also what the project's own typing
# standard asks for — see `platterpus.report_types`.
#
# Two facts that shape every remaining entry, both verified rather than assumed:
#   * a TypedDict is NOT assignable to `dict[str, object]`; `Mapping[str, object]`
#     accepts it. So read-only consumers take `Mapping`, producers take the
#     TypedDict itself.
#   * the `x or {}` idiom breaks `.get()` on a TypedDict. Every site needs
#     `x.get(k) if x else None` instead — and each one was a small lie about what
#     the callee accepted even before the types said so.
#
# `rip_compare` is deliberately NOT typed as `RipReport`: it reads arbitrary JSON
# from disk, possibly written by an older or newer Platterpus, so `dict[str, object]`
# plus the existing isinstance narrowing is the honest shape there.
[[tool.mypy.overrides]]
module = [
    "platterpus.rip_report",                  # 67 — the .platterpus.json shape
    "platterpus.rip_compare",                 # 18 — reads that same shape
    "platterpus.adapters.musicbrainz_client", # 10 — genuine raw-JSON boundary
    "platterpus.ui.main_window_shared",       #  9 — shared-surface report attrs
    "platterpus.ui.main_window",              #  6
    "platterpus.workers.rip_worker",          #  5
    "platterpus.read_speed_ladder",           #  2
    "platterpus.config",                      #  2
    "platterpus.ui.main_window_rip",          #  2
    # RETIRED 2026-07-31: `platterpus.parsers.cyanrip_log` — its single bare
    # `dict` was the in-progress track block, now the typed `_TrackAcc`
    # dataclass, so the parser that produces the bit-perfection claim is fully
    # checked (rule #10's "retire one opt-out per commit").
]
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "musicbrainzngs.*"
ignore_missing_imports = true

# `platterpus._build` is GENERATED by the AppImage/release build (it stamps the
# commit fingerprint) and is absent from a source checkout, so its resolution
# legitimately differs between environments — the one place a blanket ignore is
# correct rather than a way of hiding a real missing dependency.
[[tool.mypy.overrides]]
module = "platterpus._build"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
# `-q` keeps the output readable while the suite is small.
# `--strict-markers` rejects typo'd `@pytest.mark.foo` decorators.
# Coverage flags are NOT in addopts on purpose: a bare local `pytest` stays
# fast and plugin-light. CI adds `--cov ... --cov-fail-under` explicitly
# (see .github/workflows/ci.yml); the thresholds live there, not here.
addopts = "-q --strict-markers"

# Coverage config (consumed when CI runs `pytest --cov`). Branch coverage is
# stricter than line coverage — it requires both sides of every if/try taken.
[tool.coverage.run]
branch = true
source = ["platterpus"]

[tool.coverage.report]
# Don't count lines that are unreachable-by-design.
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",  # `...` stub bodies on Protocol/ABC methods
]
